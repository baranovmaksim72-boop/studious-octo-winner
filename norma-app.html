<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>НОРМА — платформа обучения ОТ, ПБ, ПрБ, ЭБ и экологии</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111A20; --ink-2:#2A3A44; --muted:#5F7078; --line:#DDE4E3; --line-2:#EDF1F0;
  --paper:#F3F6F5; --card:#FFFFFF; --sunk:#F7F9F8;
  --blue:#12529E; --blue-soft:#E6EEF9;      /* предписывающий — норма */
  --amber:#B9791A; --amber-soft:#FBF0DC;    /* предупреждающий — мнение, внимание */
  --green:#0E7A52; --green-soft:#E2F2EA;    /* действует */
  --red:#B3312A; --red-soft:#FAE7E5;        /* утратил силу, нарушение */
  --grey-soft:#EAEEED;
  --radius:10px; --radius-s:6px;
  --sans:'Golos Text',system-ui,'Segoe UI',Roboto,Arial,sans-serif;
  --display:'Unbounded','Golos Text',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(17,26,32,.06),0 8px 24px -16px rgba(17,26,32,.35);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ink:#E8EEEC; --ink-2:#C2CFCC; --muted:#8FA3A8; --line:#25333A; --line-2:#1C282E;
  --paper:#0D1418; --card:#131E23; --sunk:#182429;
  --blue:#7FB0F0; --blue-soft:#15263B; --amber:#E7B45E; --amber-soft:#332714;
  --green:#5FCA9C; --green-soft:#10301F; --red:#F08A80; --red-soft:#33181A; --grey-soft:#1D2A30;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --ink:#E8EEEC; --ink-2:#C2CFCC; --muted:#8FA3A8; --line:#25333A; --line-2:#1C282E;
  --paper:#0D1418; --card:#131E23; --sunk:#182429;
  --blue:#7FB0F0; --blue-soft:#15263B; --amber:#E7B45E; --amber-soft:#332714;
  --green:#5FCA9C; --green-soft:#10301F; --red:#F08A80; --red-soft:#33181A; --grey-soft:#1D2A30;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
  font-feature-settings:"ss01";-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- каркас ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);background:var(--card);position:sticky;top:0;height:100vh;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 10px 24px}
.brand{display:flex;gap:10px;align-items:center;padding:6px 10px 14px}
.mark{width:30px;height:30px;border-radius:7px;background:var(--ink);color:var(--paper);display:grid;place-items:center;
  font-family:var(--display);font-size:13px;flex:none}
.brand b{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand span{display:block;font-size:11px;color:var(--muted);font-weight:500;line-height:1.2}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;gap:9px;align-items:center;text-align:left;background:none;border:0;padding:7px 10px;border-radius:8px;
  cursor:pointer;color:var(--ink-2);font-size:14px;font-weight:500;width:100%}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="true"]{background:var(--ink);color:var(--paper)}
.nav .ic{width:18px;text-align:center;font-size:14px;flex:none}
.nav .sect{font-size:11px;color:var(--muted);padding:14px 10px 4px;font-weight:600}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:20px;padding:0 6px;font-size:11px;font-weight:600}
.nav button[aria-current="true"] .badge{background:var(--paper);color:var(--ink)}
.main{min-width:0;padding:22px clamp(14px,3vw,34px) 96px;max-width:1120px}
.topbar{display:none}
.mobnav{display:none}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .main{padding:8px 14px 108px}
  .topbar{display:flex;position:sticky;top:0;z-index:30;gap:10px;align-items:center;background:var(--card);
    margin:0 -14px 10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;border-bottom:1px solid var(--line)}
  .mobnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px)}
  .mobnav button{background:none;border:0;display:grid;gap:2px;justify-items:center;font-size:10px;color:var(--muted);
    font-weight:600;padding:4px 2px;border-radius:8px;cursor:pointer}
  .mobnav button span{font-size:17px;line-height:1}
  .mobnav button[aria-current="true"]{color:var(--ink)}
}

/* ---------- типографика ---------- */
h1{font-family:var(--display);font-weight:600;font-size:clamp(21px,3.4vw,28px);line-height:1.18;letter-spacing:-.02em;margin:0 0 6px}
h2{font-size:clamp(17px,2.4vw,20px);font-weight:600;margin:26px 0 10px;letter-spacing:-.01em}
h3{font-size:15px;font-weight:600;margin:18px 0 6px}
p{margin:0 0 10px;max-width:74ch}
.lede{color:var(--muted);max-width:70ch;margin:0 0 16px}
.small{font-size:13px;color:var(--muted)}
.tiny{font-size:11.5px;color:var(--muted)}
ul,ol{margin:0 0 10px;padding-left:20px;max-width:74ch}li{margin:3px 0}
.num{font-family:var(--display);font-weight:600;letter-spacing:-.03em}

/* ---------- элементы ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:8px 14px;border-radius:8px;font-weight:600;
  font-size:14px;cursor:pointer}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.soft{background:var(--sunk);border-color:var(--line);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:4px 11px;font-size:13px;cursor:pointer;
  color:var(--ink-2);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:5px;
  background:var(--grey-soft);color:var(--ink-2);white-space:nowrap}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.bad{background:var(--red-soft);color:var(--red)}
.tag.law{background:var(--blue-soft);color:var(--blue)}
.bar{height:7px;border-radius:6px;background:var(--grey-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:6px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--ink-2)}
.item .t{font-weight:600;font-size:14.5px}
.spacer{flex:1}
.hr{height:1px;background:var(--line);margin:18px 0;border:0}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
@media(max-width:560px){.kv{grid-template-columns:1fr;gap:0 0}.kv dt{margin-top:8px;font-size:12px}}

/* ---------- смысловые блоки обучения ---------- */
.norm{border:1px solid var(--blue);border-left-width:4px;background:var(--blue-soft);border-radius:var(--radius);padding:14px 16px;margin:12px 0}
.norm .lbl{font-size:11.5px;font-weight:700;color:var(--blue);margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.norm blockquote{margin:0;font-size:14.5px;line-height:1.6}
.opinion{border:1px solid var(--amber);border-left-width:4px;background:var(--amber-soft);border-radius:var(--radius);padding:14px 16px;margin:12px 0}
.opinion .lbl{font-size:11.5px;font-weight:700;color:var(--amber);margin-bottom:6px}
.expl{border:1px solid var(--line);border-left:4px solid var(--muted);background:var(--card);border-radius:var(--radius);
  padding:13px 16px;margin:10px 0}
.expl h4{margin:0 0 5px;font-size:13px;font-weight:700;color:var(--muted)}
.expl p:last-child,.expl ul:last-child{margin-bottom:0}
.warnstripe{background:repeating-linear-gradient(45deg,var(--amber-soft),var(--amber-soft) 9px,transparent 9px,transparent 18px);
  border:1px solid var(--amber);border-radius:var(--radius);padding:12px 14px;margin:12px 0;font-size:13.5px}
.chain{display:flex;flex-direction:column;gap:0;margin:12px 0}
.chain .step{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 13px;font-size:13.5px}
.chain .step b{display:block;font-size:11px;color:var(--muted);font-weight:600}
.chain .arw{height:14px;margin-left:22px;border-left:2px dotted var(--line)}
.quiz-opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:11px 13px;cursor:pointer;font-size:14.5px}
.quiz-opt:hover{border-color:var(--ink-2)}
.quiz-opt[data-state="sel"]{border-color:var(--ink);background:var(--sunk)}
.quiz-opt[data-state="ok"]{border-color:var(--green);background:var(--green-soft)}
.quiz-opt[data-state="bad"]{border-color:var(--red);background:var(--red-soft)}
.quiz-opt .mk{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;
  font-size:12px;font-weight:700;margin-top:1px}
.flash{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:26px 18px;text-align:center;min-height:170px;
  display:grid;place-content:center;gap:10px}
.modal-bg{position:fixed;inset:0;background:rgba(9,14,17,.55);z-index:60;display:grid;place-items:end center;padding:0}
.modal{background:var(--card);border-radius:14px 14px 0 0;width:min(720px,100%);max-height:88vh;overflow:auto;
  padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 22px);border:1px solid var(--line)}
@media(min-width:720px){.modal-bg{place-items:center}.modal{border-radius:14px}}
.modal{position:relative}
.modal-x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  background:var(--sunk);color:var(--muted);font-size:15px;line-height:1;cursor:pointer;z-index:2}
.modal-x:hover{color:var(--ink)}
.modal>h2:first-of-type{padding-right:44px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 78px);z-index:80;
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);max-width:90vw}
.searchbox{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--sunk);font-size:12.5px;color:var(--muted);font-weight:600}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stat .v{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:-.03em;line-height:1}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:4px}
.hero{background:var(--ink);color:var(--paper);border-radius:14px;padding:20px;margin-bottom:16px}
.hero .v{font-family:var(--display);font-size:clamp(40px,10vw,64px);font-weight:600;letter-spacing:-.04em;line-height:.95}
.hero .bar{background:rgba(255,255,255,.18)}.hero .bar>i{background:var(--paper)}
.hero .small{color:rgba(255,255,255,.66)}
.graph{width:100%;height:auto;background:var(--sunk);border:1px solid var(--line);border-radius:var(--radius)}
.audio-on{background:var(--green-soft)!important;border-color:var(--green)!important;color:var(--green)!important}
.skip{position:absolute;left:-9999px}
</style>
</head>

const ARTICLES = [
{id:'a-tk-214', doc:'tk', clause:'Статья 214', dir:'ot',
 title:'Обязанности работодателя в области охраны труда', mode:'abridged',
 text:'Работодатель обязан обеспечить безопасные условия труда: безопасность работников при эксплуатации зданий, сооружений, оборудования и осуществлении технологических процессов; создание и функционирование СУОТ; систематическое выявление опасностей и профессиональных рисков, их регулярный анализ и оценку; обучение по охране труда, инструктажи, стажировку и проверку знаний; недопущение к работе лиц, не прошедших обучение, инструктаж и обязательный медосмотр; приобретение и выдачу СИЗ; расследование и учёт несчастных случаев и профзаболеваний; информирование работников об условиях труда и риске повреждения здоровья.',
 simple:'Это «список обязанностей работодателя». Почти каждое требование других документов по охране труда вырастает из одного из пунктов этой статьи. Если инспектор находит нарушение, он почти всегда сначала ссылается на статью 214 ТК РФ, а уже потом — на конкретные правила.',
 practice:'На предприятии это означает: должна быть работающая СУОТ (положение + реально выполняемые процедуры), проведена оценка профрисков, организованы обучение и инструктажи, выданы СИЗ по нормам, проведены медосмотры и СОУТ, ведётся расследование и учёт несчастных случаев.',
 example:'Проверка на складе. Работники есть, стеллажи есть, СИЗ выданы. Но реестра опасностей нет, оценка профрисков не проводилась. Формально «всё в порядке», фактически — не выполнено требование о систематическом выявлении опасностей и оценке профессиональных рисков.',
 mistakes:['Считать, что «положение о СУОТ лежит в папке» = СУОТ работает.','Проводить оценку профрисков один раз и забыть о ней при изменении технологии.','Допускать работника к работе до инструктажа, «потому что сегодня аврал».'],
 inspector:'Инспектор проверяет не наличие бумаги, а связку: опасность выявлена → мера защиты назначена → работник обучен → СИЗ выдан → выполнение контролируется.',
 remember:'Ст. 214 ТК РФ — корень всей системы: обучение, СИЗ, риски, расследование.'},

{id:'a-2464-vidy', doc:'pp2464', clause:'Раздел I–II (виды обучения)', dir:'ot',
 title:'Какие виды обучения по охране труда существуют', mode:'abridged',
 text:'Порядок № 2464 разделяет обучение на инструктажи по охране труда (вводный, первичный, повторный, внеплановый, целевой), стажировку на рабочем месте, обучение по оказанию первой помощи пострадавшим, обучение по использованию (применению) средств индивидуальной защиты и обучение требованиям охраны труда по программам: А — общие вопросы охраны труда и функционирования СУОТ, Б — безопасные методы и приёмы выполнения работ при воздействии вредных и (или) опасных производственных факторов, В — безопасные методы и приёмы выполнения работ повышенной опасности.',
 simple:'«Обучение по охране труда» — не одно мероприятие, а пять разных. Инструктаж ≠ обучение по программе А. Первая помощь и использование СИЗ — отдельные виды обучения со своими сроками и своими протоколами.',
 practice:'Специалист составляет перечень: кто какие виды обучения проходит, с какой периодичностью, кто обучает внутри организации, а кого направляют в учебный центр. Результаты обучения оформляются протоколами; сведения об обученных лицах вносятся в реестр Минтруда в установленных случаях.',
 example:'Электромонтёр проходит: вводный инструктаж, первичный инструктаж на рабочем месте, стажировку, обучение по программе Б и В (работы повышенной опасности), первую помощь, использование СИЗ. Плюс — обучение по электробезопасности с присвоением группы по отдельным правилам.',
 mistakes:['Считать инструктаж заменой обучению по программам А/Б/В.','Не проводить обучение по использованию СИЗ, ограничиваясь росписью в карточке выдачи.','Обучать «всех подряд» по программе А и не проводить В для работ повышенной опасности.'],
 inspector:'Инспектор просит перечень работников по видам обучения и сверяет его с протоколами и реестром обученных лиц.',
 remember:'Пять видов: инструктажи · стажировка · первая помощь · СИЗ · программы А/Б/В.'},

{id:'a-2464-instr', doc:'pp2464', clause:'Раздел II (инструктажи)', dir:'ot',
 title:'Инструктажи: виды, кто проводит и когда', mode:'abridged',
 text:'Вводный инструктаж проводится до начала выполнения трудовых функций для вновь принятых работников и иных лиц, участвующих в производственной деятельности. Инструктаж по охране труда на рабочем месте подразделяется на первичный и повторный; повторный проводится не реже одного раза в шесть месяцев. Внеплановый инструктаж проводится при изменении нормативных требований, технологических процессов, после несчастного случая и в иных установленных случаях. Целевой инструктаж проводится, в частности, перед выполнением работ повышенной опасности, на которые оформляется наряд-допуск, а также перед ликвидацией последствий чрезвычайных ситуаций.',
 simple:'Инструктаж — это короткий разговор о конкретных опасностях этого рабочего места, а не лекция про охрану труда вообще. Вводный — один раз при приёме. Первичный — на рабочем месте. Повторный — минимум раз в полгода. Внеплановый — когда что-то изменилось. Целевой — под конкретную разовую работу.',
 practice:'Нужны: программы каждого вида инструктажа, журналы (или электронный учёт), перечень освобождённых от первичного инструктажа работников, назначенные приказом лица, проводящие инструктажи и сами прошедшие обучение.',
 example:'Слесарь переведён с участка сборки на участок мойки деталей, где применяются химические вещества. Повторный инструктаж «по графику» здесь не спасает: нужен первичный инструктаж на новом рабочем месте по программе, учитывающей химический фактор.',
 mistakes:['Подписывать журнал задним числом — при расследовании несчастного случая это выясняется первым.','Освобождать от первичного инструктажа всех офисных работников без утверждённого перечня и условий.','Проводить целевой инструктаж «в общем», без привязки к конкретному наряду-допуску.'],
 inspector:'Сверяют даты в журнале с датой приёма на работу и датой наряда-допуска, а также подготовку самого инструктирующего.',
 remember:'Вводный → первичный → повторный (≥1 раз в 6 мес.) → внеплановый → целевой.'},

{id:'a-766-normy', doc:'p766n', clause:'Правила (локальные нормы выдачи СИЗ)', dir:'ot',
 title:'Нормы выдачи СИЗ разрабатывает сам работодатель', mode:'abridged',
 text:'Работодатель определяет потребность в СИЗ и смывающих средствах и утверждает локальным нормативным актом нормы бесплатной выдачи СИЗ, разработанные на основе Единых типовых норм с учётом результатов специальной оценки условий труда, результатов оценки профессиональных рисков, мнения выборного органа первичной профсоюзной организации (при наличии).',
 simple:'Раньше брали готовую отраслевую норму и выдавали «как в таблице». Теперь работодатель сам собирает норму для каждой должности: берёт ЕТН, смотрит на результаты СОУТ и профрисков и утверждает свой документ.',
 practice:'Порядок действий: составить перечень профессий и должностей → взять нормы из ЕТН (приложения 1–3 к приказу 767н) → добавить СИЗ под опасности, выявленные при оценке профрисков → учесть класс условий труда по СОУТ → утвердить ЛНА «Нормы бесплатной выдачи СИЗ» → выдавать и вести учёт (в том числе в электронном виде).',
 example:'В ЕТН для профессии предусмотрены перчатки и костюм. Оценка профрисков на участке показала риск разлёта искр при зачистке. В локальную норму добавляются защитные очки и термостойкие перчатки — норму можно улучшать, но не ухудшать.',
 mistakes:['Продолжать применять старые типовые отраслевые нормы — с 01.01.2025 это уже не действующее основание.','Выдать СИЗ и не обучить их правильному применению — это отдельный вид обучения.','Не учитывать результаты оценки профрисков, ограничившись переписыванием ЕТН.'],
 inspector:'Проверяют цепочку: СОУТ и профриски → локальные нормы → карточки выдачи → фактическое наличие и состояние СИЗ на работнике.',
 remember:'ЕТН + СОУТ + профриски → свой ЛНА с нормами выдачи.'},

{id:'a-782-vysota', doc:'p782n', clause:'Правила (определение работ на высоте)', dir:'ot',
 title:'Какие работы считаются работами на высоте', mode:'abridged',
 text:'К работам на высоте относятся работы, при которых существуют риски, связанные с возможным падением работника с высоты 1,8 м и более, а также работы на площадках на расстоянии ближе 2 м от неогороженных перепадов по высоте более 1,8 м (при высоте ограждения менее 1,1 м), и работы, при которых возможно падение с высоты менее 1,8 м над машинами или механизмами, водной поверхностью, выступающими предметами, а также при подъёме или спуске по лестнице на высоту более 5 м под углом более 75° к горизонтали.',
 simple:'«Высота» — это не «где-то высоко», а конкретные признаки. Если есть риск падения с 1,8 м и выше — это уже работа на высоте со всеми вытекающими требованиями: обучение, группы, наряд-допуск, страховочные системы.',
 practice:'Работодатель составляет перечень мест и видов работ на высоте, определяет, какие из них выполняются по наряду-допуску, назначает ответственных, обеспечивает обучение и периодическую проверку знаний, выдаёт системы обеспечения безопасности работ на высоте и организует план эвакуации и спасения.',
 example:'Работник меняет светильник со стремянки на высоте 2,1 м в цехе. Формально «просто лампочка» — фактически работа на высоте: нужны обучение соответствующей группы, средства защиты и соблюдение правил, а не «подержи стремянку».',
 mistakes:['Считать, что высота начинается с 5 м.','Применять страховочную привязь без пригодного анкерного устройства — крепить «за что попало».','Не иметь плана мероприятий по эвакуации и спасению при работах на высоте.'],
 inspector:'Проверяют перечень работ на высоте, наряды-допуски, удостоверения с группой и комплектность и сроки испытаний СИЗ от падения.',
 remember:'1,8 м — порог; при рисках — независимо от высоты.'},

{id:'a-903-org', doc:'p903n', clause:'Правила, организационные мероприятия', dir:'eb',
 title:'Организационные мероприятия при работах в электроустановках', mode:'abridged',
 text:'Организационными мероприятиями, обеспечивающими безопасность работ в электроустановках, являются: оформление работ нарядом-допуском, распоряжением или перечнем работ, выполняемых в порядке текущей эксплуатации; выдача разрешения на подготовку рабочего места и на допуск; допуск к работе; надзор во время работы; оформление перерывов в работе, перевода на другое место, окончания работы.',
 simple:'Прежде чем что-то отключать и трогать, нужно навести организационный порядок: кто разрешил, кто подготовил место, кто допустил, кто следит за бригадой и кто закрыл работу. Технические мероприятия (отключение, заземление и т. д.) идут после организационных.',
 practice:'Работодатель определяет перечень работ, выполняемых по нарядам, по распоряжениям и в порядке текущей эксплуатации, назначает ответственных лиц с соответствующими группами по электробезопасности и обеспечивает ведение журналов учёта работ.',
 example:'Ремонт в РУ-0,4 кВ начали по устной команде мастера: «там же всё обесточено». Наряд не оформлен, допуск не проведён. Даже если травмы не будет, это уже нарушение организационных мероприятий; при травме оно станет ключевым пунктом акта расследования.',
 mistakes:['Совмещать несовместимые обязанности ответственных лиц вопреки правилам.','Оформлять наряд формально, без указания мер безопасности.','Относить к «текущей эксплуатации» работы, которых нет в утверждённом перечне.'],
 inspector:'Проверяют наряды за период, журнал учёта работ, перечни работ и соответствие групп по электробезопасности назначенным ролям.',
 remember:'Наряд/распоряжение → разрешение → допуск → надзор → окончание.'},

{id:'a-903-tech', doc:'p903n', clause:'Правила, технические мероприятия', dir:'eb',
 title:'Технические мероприятия при снятии напряжения', mode:'abridged',
 text:'При подготовке рабочего места со снятием напряжения выполняются в установленном порядке: производство необходимых отключений и принятие мер, препятствующих подаче напряжения на место работы вследствие ошибочного или самопроизвольного включения коммутационных аппаратов; вывешивание запрещающих плакатов; проверка отсутствия напряжения на токоведущих частях; установка заземления (включение заземляющих ножей либо установка переносных заземлений); ограждение при необходимости рабочих мест и вывешивание предупреждающих, предписывающих и указательных плакатов.',
 simple:'Последовательность жёсткая и менять её нельзя: отключил → защитил от ошибочного включения → повесил плакаты → проверил, что напряжения действительно нет → заземлил → оградил. Проверка отсутствия напряжения всегда идёт до заземления.',
 practice:'Персонал применяет исправные и испытанные указатели напряжения и переносные заземления, проверяет указатель перед использованием, соблюдает порядок операций и фиксирует подготовку рабочего места.',
 example:'Бригада установила переносное заземление, не проверив отсутствие напряжения указателем — «по схеме же отключено». Если схема или отключение ошибочны, установка заземления превращается в короткое замыкание непосредственно на рабочем месте.',
 mistakes:['Проверять отсутствие напряжения «контролькой» или на ощупь.','Использовать указатель напряжения с истёкшим сроком испытания.','Заземлять только с одной стороны, когда возможна подача напряжения с другой.'],
 inspector:'Проверяют журналы испытаний электрозащитных средств, штампы и сроки, наличие и состояние переносных заземлений.',
 remember:'Отключить → запереть → проверить отсутствие напряжения → заземлить → оградить.'},

{id:'a-1479-instr', doc:'pp1479', clause:'ППР в РФ (инструкция о мерах пожарной безопасности)', dir:'pb',
 title:'Инструкция о мерах пожарной безопасности', mode:'abridged',
 text:'Руководитель организации обеспечивает наличие инструкции о мерах пожарной безопасности, разработанной в соответствии с требованиями Правил противопожарного режима, в том числе с учётом специфики взрывопожароопасных и пожароопасных помещений, а также организует ознакомление работников с её требованиями.',
 simple:'Инструкция о мерах пожарной безопасности — обязательный документ, а не формальность. Она должна описывать именно этот объект: где курить нельзя, где хранится что, как эвакуироваться, кто звонит в пожарную охрану, кто отключает оборудование.',
 practice:'Разрабатывается инструкция по объекту (и при необходимости — отдельные для пожароопасных помещений), работники с ней знакомятся, порядок действий отрабатывается на практических тренировках эвакуации.',
 example:'На складе инструкция скачана из интернета: в ней упоминаются цеха и участки, которых в организации нет, а про стеллажное хранение и проходы — ни слова. При проверке такая инструкция равносильна её отсутствию.',
 mistakes:['Типовая инструкция без привязки к объекту.','Отсутствие ознакомления работников под подпись.','Не пересматривать инструкцию после перепланировки или смены технологии.'],
 inspector:'Смотрят на соответствие инструкции реальному объекту и на то, знают ли работники свои действия при пожаре.',
 remember:'Инструкция описывает ваш объект, а не «объект вообще».'},

{id:'a-1479-ognevye', doc:'pp1479', clause:'ППР в РФ (огневые работы)', dir:'pb',
 title:'Огневые работы и наряд-допуск', mode:'abridged',
 text:'Проведение огневых работ на временных местах (кроме строительных площадок и частных домовладений) допускается после оформления наряда-допуска на выполнение огневых работ; место проведения работ обеспечивается первичными средствами пожаротушения, горючие материалы в радиусе очистки убираются, а после окончания работ организуется наблюдение за местом их проведения.',
 simple:'Сварка и резка вне специально оборудованного поста — это всегда наряд-допуск, подготовка места и наблюдение после работ. Большинство «сварочных» пожаров случается не во время работ, а через несколько часов после их окончания.',
 practice:'Оформляется наряд-допуск, назначается ответственный, место очищается от горючего, проверяется отсутствие горючих материалов ниже и рядом, обеспечиваются огнетушители и покрывала, организуется наблюдение после окончания работ.',
 example:'Резали металлоконструкцию на антресоли. Искры попали в щель перекрытия на утеплитель. Работы закончились в 17:00, возгорание обнаружили в 20:40 — наблюдение после работ не организовали.',
 mistakes:['Выполнять огневые работы без наряда-допуска «на пять минут».','Не проверять нижележащие уровни и полости, куда падают искры.','Снимать наблюдение сразу после окончания работ.'],
 inspector:'Запрашивают наряды-допуски на огневые работы и порядок их оформления, проверяют журналы и подготовку исполнителей.',
 remember:'Огневые работы = наряд-допуск + подготовка места + наблюдение после.'},

{id:'a-116-opo', doc:'fz116', clause:'Ст. 2, приложения 1 и 2', dir:'prb',
 title:'Что такое ОПО и классы опасности', mode:'abridged',
 text:'К категории опасных производственных объектов относятся объекты, на которых получаются, используются, перерабатываются, образуются, хранятся, транспортируются, уничтожаются опасные вещества; используется оборудование, работающее под избыточным давлением; используются стационарно установленные грузоподъёмные механизмы, эскалаторы, канатные дороги, фуникулёры; получаются расплавы чёрных и цветных металлов; ведутся горные работы и работы по обогащению полезных ископаемых; и иные объекты, указанные в приложении 1 к закону. Опасные производственные объекты подлежат регистрации в государственном реестре и по степени опасности делятся на четыре класса.',
 simple:'ОПО — это не «опасное предприятие вообще», а объект с конкретным признаком из приложения 1 к закону. От класса опасности зависят лицензирование, производственный контроль, частота проверок и требования к страхованию.',
 practice:'Организация выявляет признаки ОПО, регистрирует объект, разрабатывает положение о производственном контроле, назначает ответственных, организует аттестацию по промышленной безопасности, страхует ответственность и проводит экспертизу промышленной безопасности в установленных случаях.',
 example:'Предприятие эксплуатирует стационарный мостовой кран в цехе и считает, что «это просто оборудование». По признаку использования стационарно установленных грузоподъёмных механизмов объект может относиться к ОПО — с обязанностью регистрации.',
 mistakes:['Не регистрировать объект, потому что «мы не химия».','Считать производственный контроль формальным документом.','Не проводить экспертизу промышленной безопасности при истечении срока службы оборудования.'],
 inspector:'Ростехнадзор проверяет регистрацию, сведения об ОПО, систему производственного контроля и аттестацию работников.',
 remember:'Признак из приложения 1 → регистрация → класс опасности → объём требований.'},

{id:'a-7-nvos', doc:'fz7', clause:'Ст. 4.2 и связанные', dir:'eco',
 title:'Категории объектов, оказывающих негативное воздействие', mode:'abridged',
 text:'Объекты, оказывающие негативное воздействие на окружающую среду, в зависимости от уровня такого воздействия подразделяются на четыре категории: I — объекты, оказывающие значительное негативное воздействие и относящиеся к областям применения наилучших доступных технологий; II — умеренное негативное воздействие; III — незначительное негативное воздействие; IV — минимальное негативное воздействие. Объекты подлежат постановке на государственный учёт.',
 simple:'Категория объекта — это «ключ» ко всей экологической нагрузке предприятия: от неё зависят разрешительные документы, программа производственного экологического контроля, отчётность и плата за негативное воздействие.',
 practice:'Предприятие определяет категорию, подаёт заявку о постановке на государственный учёт, получает свидетельство, затем формирует комплект: ПЭК (для I–III), отчётность, декларация или комплексное экологическое разрешение — по категории.',
 example:'Предприятие отнесено к III категории, но продолжает сдавать отчётность «как раньше» и не разработало программу производственного экологического контроля. Нарушение вскрывается при первой же проверке или при сверке отчётности.',
 mistakes:['Не актуализировать сведения об объекте при изменении технологии.','Путать категорию объекта НВОС с классом опасности отходов.','Считать, что для IV категории не нужно вообще ничего — учёт и обращение с отходами всё равно требуются.'],
 inspector:'Росприроднадзор сверяет сведения об объекте, отчётность, программу ПЭК и расчёт платы.',
 remember:'Категория I–IV определяет объём экологических обязанностей.'},

{id:'a-89-othody', doc:'fz89', clause:'Ст. 4.1, 14 и связанные', dir:'eco',
 title:'Классы опасности отходов и паспортизация', mode:'abridged',
 text:'Отходы в зависимости от степени негативного воздействия на окружающую среду подразделяются на пять классов опасности: от I класса (чрезвычайно опасные) до V класса (практически неопасные). На отходы I–IV классов опасности, включённые в федеральный классификационный каталог отходов, составляется паспорт отхода; вид отхода подтверждается в установленном порядке.',
 simple:'Каждый отход надо «опознать»: определить его вид по каталогу, класс опасности и оформить паспорт (для I–IV классов). Без этого невозможно ни законно накапливать отход, ни передать его подрядчику.',
 practice:'Порядок: инвентаризация отходов → отнесение к виду по ФККО → подтверждение класса опасности → паспорта на отходы I–IV классов → организация мест накопления → учёт образования и передачи → передача лицензированной организации → отчётность.',
 example:'Отработанные люминесцентные лампы (отход высокого класса опасности) хранятся в открытой коробке у стены склада, паспорта нет, договора со специализированной организацией нет. Это типичное нарушение, которое находят почти на каждой проверке.',
 mistakes:['Передавать опасные отходы организации без действующей лицензии.','Не вести учёт в области обращения с отходами.','Хранить отходы разных классов совместно и без маркировки мест накопления.'],
 inspector:'Проверяют паспорта, журналы учёта, договоры и лицензии подрядчиков, состояние мест накопления.',
 remember:'ФККО → класс → паспорт (I–IV) → место накопления → учёт → лицензированный подрядчик.'},

 title:'Общие обязанности работодателя и принципы предотвращения (ЕС)', mode:'abridged',
 text:'Работодатель обязан обеспечить безопасность и здоровье работников во всех аспектах, связанных с работой, руководствуясь общими принципами предотвращения: избегать рисков; оценивать риски, которых избежать нельзя; бороться с рисками в источнике; адаптировать работу к человеку; учитывать технический прогресс; заменять опасное на менее опасное; развивать целостную политику предотвращения; отдавать приоритет коллективным мерам защиты перед индивидуальными; давать работникам надлежащие инструкции.',
 simple:'Европейская логика: сначала устранить риск, потом инженерные и коллективные меры, и только в последнюю очередь — СИЗ. Оценка рисков здесь не «дополнительная процедура», а основа всей системы.',
 practice:'В странах ЕС это реализуется через национальные законы: в Германии — ArbSchG (§ 5 Gefährdungsbeurteilung, § 12 Unterweisung), во Франции — Code du travail и документ единой оценки рисков (DUERP).',
 example:'Шум на участке. По европейской логике сначала рассматривают замену оборудования и шумозащитные кожухи, и только затем — противошумные вкладыши.',

 apply:[
  'Шаг 1. Определяем, кто перед нами. Это не «новичок вообще», а работник, впервые принятый к данному работодателю. Стаж по профессии значения для допуска не имеет: обязанности привязаны к факту приёма на работу и к характеру работ.',
  'Шаг 2. Смотрим на характер работ. Участок с грузоподъёмным оборудованием — основание рассмотреть работы как повышенной опасности и назначить стажировку.',
  'Шаг 3. Проверяем состав обучения. Инструктаж — это не обучение по охране труда. Первичный инструктаж на рабочем месте пройден, но обучение по программам и проверка знания не проведены.',
  'Шаг 4. Делаем вывод. Основание для допуска отсутствует: работник допущен к самостоятельной работе до завершения обязательных процедур. Нарушение возникло в момент допуска, а не «когда что-то случится».'],
 action:[
  'Отстранить работника от самостоятельной работы до завершения обучения и проверки знания требований охраны труда.',
  'Оформить и провести стажировку под руководством назначенного приказом работника, с записью в документах по обучению.',
  'Организовать обучение по применимым программам и проверку знания, результат оформить протоколом.',
  'Внести сведения в реестр обученных лиц, если такая обязанность распространяется на работодателя.',
  'Письменно довести до мастера, что решение о допуске принимает не он единолично и не по стажу «на глаз».'],
 mistake:'Считать инструктаж на рабочем месте достаточным основанием для допуска. Инструктаж, стажировка, обучение по программам и проверка знания — четыре разные процедуры, и подмена одной другой не закрывает требование.',
 liability:{doc:'koap', clause:'часть 3 статьи 5.27.1', exact:true,
   text:'Допуск работника к исполнению трудовых обязанностей без прохождения в установленном порядке обучения и проверки знания требований охраны труда влечёт административную ответственность; санкция предусмотрена в том числе для должностных лиц и для работодателя.'},
 remember:'Допуск к самостоятельной работе — это результат процедуры, а не оценка опытности работника мастером.',
 quizDir:'ot'},

{id:'e2', dir:'ot', lvl:2, tag:'СИЗ',
 title:'Работнику выдали спецодежду «как раньше», по старым типовым нормам',
 setting:'Предприятие пищевой промышленности. Специалист по охране труда готовит выдачу СИЗ на новый год, нормы выдачи не пересматривались с 2023 года.',
 story:'Карточки учёта заполняются по отраслевым типовым нормам, действовавшим до 2025 года. Оценка профессиональных рисков на участке фасовки проведена, но при определении перечня СИЗ её результаты не учитывались. Работник расписывается за перчатки и халат; защита органа слуха на линии с шумом не выдаётся, потому что «в старых нормах её не было».',
 ask:'Каким документом сейчас определяется перечень выдаваемых работнику СИЗ?',
 opts:[{doc:'p767n', ok:true},{doc:'p766n'},{doc:'tk'},{doc:'tr019'}],
 why:'Единые типовые нормы (приказ Минтруда № 767н) определяют, что именно выдаётся работнику. Правила обеспечения СИЗ (приказ № 766н) отвечают на другой вопрос — как организовать выдачу, учёт, хранение и уход. Старые отраслевые типовые нормы переходный период уже не покрывает.',
 norm:{doc:'p767n', clause:'Единые типовые нормы выдачи СИЗ', exact:false,
   text:'Единые типовые нормы устанавливают выдачу СИЗ исходя из профессии (должности) и идентифицированных на рабочем месте опасностей. Обязательное применение Единых типовых норм началось с 1 января 2025 года — переходный период, в течение которого допускалось применение прежних типовых норм, завершён.'},
 support:[{doc:'p766n', clause:'Правила обеспечения работников СИЗ', exact:false,
   text:'Правила устанавливают порядок выдачи, учёта, хранения, ухода за СИЗ, а также обязанность работодателя утвердить нормы выдачи на основе Единых типовых норм и результатов оценки профессиональных рисков и СОУТ.'},
  {doc:'tk', clause:'Статья 221', exact:true,
   text:'Работодатель за счёт своих средств обеспечивает работников средствами индивидуальной защиты, их хранение, уход и замену; работник не допускается к работе без выданных ему СИЗ.'},
  {doc:'tr019', clause:'Технический регламент на СИЗ', exact:false,
   text:'СИЗ должны соответствовать требованиям технического регламента и иметь подтверждение соответствия; выдача СИЗ без подтверждения соответствия недопустима.'}],
 apply:[
  'Шаг 1. Разделяем вопросы. «Что выдать» — Единые типовые нормы 767н. «Как выдать и учесть» — Правила 766н. «Чем подтверждается качество» — ТР ТС 019/2011. Это три разных документа, и смешивать их нельзя.',
  'Шаг 2. Проверяем дату. Ссылка на отраслевые типовые нормы 2023 года после 1 января 2025 года основанием уже не является.',
  'Шаг 3. Смотрим на шум. Опасность на рабочем месте идентифицирована, значит защита органа слуха определяется по опасности, а не по тому, «было ли это в старом перечне».',
  'Шаг 4. Фиксируем связь с оценкой рисков. Нормы выдачи работодателя формируются с учётом результатов СОУТ и оценки профессиональных рисков — без этого перечень СИЗ юридически не обоснован.'],
 action:[
  'Переработать и утвердить локальные нормы выдачи СИЗ на основе Единых типовых норм с учётом результатов СОУТ и оценки профессиональных рисков.',
  'Сопоставить идентифицированные опасности с перечнем выдаваемых СИЗ по каждому рабочему месту, особое внимание — защите органа слуха и дыхания.',
  'Проверить наличие подтверждения соответствия на все закупаемые СИЗ.',
  'Перевести учёт выдачи на действующую форму учёта, обучить работников использованию СИЗ.',
  'Провести обучение по использованию СИЗ там, где оно обязательно, и оформить его результаты.'],
 mistake:'Продолжать выдавать «по старым нормам, они привычнее». Второй по частоте вариант — считать, что Правила 766н заменили типовые нормы: они регулируют процедуру, но не состав выдаваемых СИЗ.',
 liability:{doc:'koap', clause:'часть 4 статьи 5.27.1', exact:true,
   text:'Необеспечение работников средствами индивидуальной защиты влечёт административную ответственность должностных лиц и работодателя; санкция по этой части строже, чем за большинство иных нарушений требований охраны труда.'},
 remember:'Что выдать — Единые типовые нормы. Как выдать — Правила 766н. Чем подтверждено качество — технический регламент. Три вопроса, три документа.',
 quizDir:'ot'},

{id:'e3', dir:'pb', lvl:2, tag:'Эвакуация',
 title:'Эвакуационный выход склада заставлен паллетами, дверь закрыта на навесной замок',
 setting:'Распределительный склад, класс функциональной пожарной опасности Ф5.2. Инспекционная проверка по обращению работника.',
 story:'Второй эвакуационный выход используется как хозяйственный: перед дверью стоят два ряда паллет с упаковкой, сама дверь закрыта на навесной замок, ключ у кладовщика в столе. Знак «Выход» над дверью выцвел до белого, направление эвакуации по коридору не обозначено. Заведующий складом объясняет: «через эту дверь всё равно никто не ходит, а замок — от краж».',
 ask:'Какой документ применяется к этой ситуации в первую очередь — при эксплуатации уже построенного здания?',
 opts:[{doc:'pp1479', ok:true},{doc:'sp1'},{doc:'fz123'},{doc:'gost026'}],
 why:'СП 1.13130.2020 задаёт требования к эвакуационным путям и выходам прежде всего при проектировании, реконструкции и капитальном ремонте. Поведение людей и запреты в действующем здании при его эксплуатации регулируют Правила противопожарного режима — именно по ним инспектор оценивает загромождение и замок.',
 norm:{doc:'pp1479', clause:'раздел о содержании эвакуационных путей и выходов', exact:false,
   text:'Правила противопожарного режима запрещают загромождать эвакуационные пути, проходы и выходы предметами и оборудованием, а также устраивать на путях эвакуации запоры, не позволяющие свободно открыть двери изнутри без ключа.'},
 support:[{doc:'sp1', clause:'требования к эвакуационным путям и выходам', exact:false,
   text:'Свод правил устанавливает параметры эвакуационных путей и выходов: их количество, ширину, высоту и условия использования; применяется при проектировании, реконструкции, капитальном ремонте и изменении функционального назначения.'},
  {doc:'gost026', clause:'эвакуационные знаки безопасности и сигнальная разметка', exact:false,
   text:'Стандарт устанавливает виды, цвет, размеры и правила размещения эвакуационных знаков безопасности и сигнальной разметки, включая знаки направления движения к эвакуационному выходу.'},
  {doc:'fz123', clause:'требования пожарной безопасности к объектам защиты', exact:false,
   text:'Технический регламент определяет, что соблюдение требований пожарной безопасности подтверждается выполнением нормативных документов либо расчётом пожарного риска.'}],
 apply:[
  'Шаг 1. Разделяем два нарушения. Загромождение выхода и запор, не открываемый изнутри без ключа, — самостоятельные нарушения, каждое оценивается отдельно.',
  'Шаг 2. Отвечаем на довод «через эту дверь никто не ходит». Эвакуационный выход существует не для повседневного движения, а для режима, в котором основной путь отрезан огнём или дымом.',
  'Шаг 3. Разбираемся со знаком. Выцветший знак и необозначенное направление — это уже вопрос обозначения по ГОСТ 12.4.026-2015: знак должен быть различим и размещён так, чтобы вести человека к выходу.',
  'Шаг 4. Определяем, когда применяется СП 1.13130.2020. Если склад планируют перепланировать или менять его назначение — параметры выходов проверяются по своду правил. Для текущей эксплуатации основной документ — Правила противопожарного режима.'],
 action:[
  'Немедленно освободить проход и подход к двери, вынести паллеты за пределы эвакуационного пути.',
  'Снять навесной замок и заменить запор на открываемый изнутри без ключа.',
  'Восстановить эвакуационные знаки и обозначить направление движения к выходу по коридору.',
  'Назначить ответственного за содержание эвакуационных путей и включить проверку выходов в ежедневный обход.',
  'Провести внеплановый противопожарный инструктаж с персоналом склада и зафиксировать его.'],
 mistake:'Оценивать эвакуационный выход по тому, как им пользуются в обычный день. Второй типичный довод — «ключ висит рядом»: запор должен открываться изнутри без ключа, наличие ключа поблизости требование не закрывает.',
 liability:{doc:'koap', clause:'статья 20.4', exact:true,
   text:'Нарушение требований пожарной безопасности влечёт административную ответственность. Отдельные части статьи предусматривают повышенную ответственность, в том числе за нарушения, связанные с эвакуационными путями и выходами.'},
 remember:'Эксплуатируете здание — смотрите Правила противопожарного режима. Проектируете или перестраиваете — СП 1.13130.2020. Обозначаете — ГОСТ 12.4.026-2015.',
 quizDir:'pb'},

{id:'e4', dir:'pb', lvl:2, tag:'Актуальность документа',
 title:'Программа противопожарного инструктажа разработана по приказу МЧС № 806',
 setting:'Сеть кафе, 9 точек. Владелец — индивидуальный предприниматель. Программы инструктажей утверждены в 2023 году и с тех пор не пересматривались.',
 story:'В приказе об утверждении программ и в самих программах стоит ссылка: «в соответствии с приказом МЧС России от 18.11.2021 № 806». Ответственный за пожарную безопасность прошёл в своё время пожарно-технический минимум. Новых работников инструктируют по этим же программам, стажёров и практикантов не инструктируют вовсе — «они же не в штате».',
 ask:'Каким документом сейчас определяется порядок противопожарных инструктажей?',
 opts:[{doc:'p806'},{doc:'p1120', ok:true},{doc:'pp1479'},{doc:'pp2464'}],
 why:'Приказ МЧС России от 16.12.2024 № 1120 вступил в силу с 1 сентября 2025 года, и этим же приказом приказ № 806 признан утратившим силу. Ссылаться на № 806 после этой даты нельзя: документа в правовом поле больше нет.',
 norm:{doc:'p1120', clause:'Документ в целом', exact:true,
   text:'Приказ определяет порядок, виды и сроки обучения по программам противопожарного инструктажа, требования к содержанию программ, порядок их утверждения и согласования, а также категории лиц, обучаемых по дополнительным профессиональным программам в области пожарной безопасности. Действует с 01.09.2025 до 01.09.2031. Приказ МЧС России от 18.11.2021 № 806 признан утратившим силу.'},
 support:[{doc:'p806', clause:'Документ утратил силу', exact:true,
   text:'Применялся с 01.03.2022 по 31.08.2025. После 01.09.2025 ссылка на этот приказ в локальных документах означает, что документ опирается на несуществующую норму.'},
  {doc:'fz69', clause:'Статья 25', exact:false,
   text:'Федеральный закон о пожарной безопасности закрепляет обязательность обучения мерам пожарной безопасности и служит основанием для приказа МЧС России, устанавливающего порядок такого обучения.'}],
 apply:[
  'Шаг 1. Проверяем сам документ-основание, а не текст программы. Программа может быть содержательно разумной и при этом юридически опираться на утративший силу приказ.',
  'Шаг 2. Смотрим на статус работодателя. По новому порядку обязанность обучать работников распространяется и на индивидуальных предпринимателей — владельцев объектов защиты. Довод «я ИП, а не организация» больше не работает.',
  'Шаг 3. Проверяем круг обучаемых. Стажёры и практиканты тоже проходят вводный противопожарный инструктаж — отсутствие трудового договора от инструктажа не освобождает.',
  'Шаг 4. Разбираемся с ПТМ. Понятие пожарно-технического минимума из порядка исключено, поэтому «у меня ПТМ пройден» перестало быть универсальным ответом на вопрос об обучении ответственного лица.'],
 action:[
  'Заменить во всех приказах, программах и журналах ссылку на приказ № 806 ссылкой на приказ МЧС России № 1120.',
  'Переработать содержание программ инструктажей под требования нового порядка и утвердить их заново.',
  'Определить, кто из ответственных лиц должен пройти обучение по дополнительным профессиональным программам, и направить их на обучение.',
  'Включить стажёров и практикантов в порядок проведения вводного инструктажа.',
  'Ввести правило: при утверждении любого локального документа проверять статус документа-основания на официальном портале.'],
 mistake:'Проверять содержание локального документа и не проверять, жив ли документ, на который он ссылается. Ошибка почти невидима внутри организации и обнаруживается на первой же проверке.',
 liability:{doc:'koap', clause:'статья 20.4', exact:true,
   text:'Нарушение требований пожарной безопасности, включая необучение работников мерам пожарной безопасности в установленном порядке, влечёт административную ответственность.'},
 remember:'Локальный документ живёт ровно столько, сколько живёт документ, на который он ссылается. Смена приказа-основания обнуляет программу, даже если её текст не изменился.',
 quizDir:'pb'},

{id:'e5', dir:'eb', lvl:3, tag:'Организация работ',
 title:'Электромонтёра отправили в РУ-0,4 кВ по телефонному распоряжению',
 setting:'Производственная площадка, собственная служба главного энергетика. Пятница, конец смены, нужно «быстро заменить автомат».',
 story:'Мастер по телефону поручает электромонтёру с III группой заменить автоматический выключатель в щите РУ-0,4 кВ. Ни наряд-допуск, ни распоряжение не оформляются, запись в журнале не делается. Работник идёт один, отключает вводной автомат, указателем напряжения не пользуется («автомат же выключен»), переносное заземление не устанавливает. Работа выполнена, никто не пострадал.',
 ask:'Какой документ определяет, как должна быть организована эта работа?',
 opts:[{doc:'p903n', ok:true},{doc:'ptep811'},{doc:'tk'},{doc:'pp2464'}],
 why:'Правила по охране труда при эксплуатации электроустановок (приказ Минтруда № 903н) определяют организационные и технические мероприятия, обеспечивающие безопасность работ. ПТЭЭП (приказ Минэнерго № 811) регулируют техническую эксплуатацию электроустановок — это смежный, но другой предмет.',
 norm:{doc:'p903n', clause:'организационные и технические мероприятия при работах в электроустановках', exact:false,
   text:'Правила устанавливают, что работы в электроустановках выполняются по наряду-допуску, по распоряжению или в порядке текущей эксплуатации, и определяют перечень организационных мероприятий (оформление работ, допуск, надзор, оформление перерывов и окончания работ) и технических мероприятий (отключение, вывешивание плакатов, проверка отсутствия напряжения, установка заземления).'},
 support:[{doc:'ptep811', clause:'правила технической эксплуатации электроустановок потребителей', exact:false,
   text:'Устанавливают требования к организации эксплуатации электроустановок: назначение ответственного за электрохозяйство, ведение технической документации, оперативное обслуживание.'},
  {doc:'tk', clause:'Статья 214', exact:true,
   text:'Работодатель обязан обеспечить безопасность работников при эксплуатации оборудования и применение процедур управления профессиональными рисками.'}],
 apply:[
  'Шаг 1. Отделяем «что делали» от «как оформили». Работа могла быть выполнена технически грамотно — нарушение возникло уже на этапе выдачи задания без оформления.',
  'Шаг 2. Проверяем форму задания. Телефонное поручение не является ни нарядом-допуском, ни распоряжением: распоряжение имеет разовый характер и регистрируется в журнале.',
  'Шаг 3. Проверяем технические мероприятия. Проверка отсутствия напряжения указателем — обязательное действие, а не формальность: положение рукоятки автомата не доказывает отсутствие напряжения.',
  'Шаг 4. Оцениваем «никто не пострадал». Отсутствие пострадавшего не меняет квалификацию: нарушение фиксируется по факту организации работ, а не по последствиям.'],
 action:[
  'Оформлять такие работы нарядом-допуском или распоряжением с регистрацией в журнале учёта работ.',
  'Выполнять технические мероприятия в установленной последовательности, обязательно с проверкой отсутствия напряжения указателем.',
  'Утвердить и довести до персонала перечень работ, выполняемых в порядке текущей эксплуатации, чтобы «быстрые» задания имели законную форму.',
  'Проверить достаточность группы по электробезопасности и допустимость работы в одно лицо для данного вида работ.',
  'Разобрать случай с мастером: выдача задания без оформления — нарушение со стороны того, кто задание выдал.'],
 mistake:'Считать, что при малом напряжении и коротком объёме работ оформление избыточно. Именно «работа на пять минут» даёт основную долю электротравм.',
 liability:{doc:'koap', clause:'часть 1 статьи 5.27.1', exact:true,
   text:'Нарушение государственных нормативных требований охраны труда влечёт предупреждение или административный штраф для должностных лиц и работодателя; при наступлении тяжких последствий возможна уголовная ответственность по соответствующим статьям.'},
 remember:'Работа в электроустановке начинается не с инструмента, а с формы задания. Нет наряда, распоряжения или перечня текущей эксплуатации — нет законного основания начинать.',
 quizDir:'eb'},

{id:'e6', dir:'ot', lvl:3, tag:'Работы на высоте',
 title:'Обслуживание кровли на высоте 6 метров без наряда-допуска',
 setting:'Административное здание. Двое рабочих подрядчика чистят снег с кровли, ограждение по периметру отсутствует.',
 story:'Работников направили устно. Страховочные привязи выданы, но закрепить их не за что: анкерных устройств на кровле нет, страховочная система фактически не используется. План производства работ не разрабатывался, наряд-допуск не оформлялся. Ответственный за работы на высоте со стороны заказчика на объекте не появлялся.',
 ask:'Какой документ устанавливает требования к организации этих работ?',
 opts:[{doc:'p782n', ok:true},{doc:'p766n'},{doc:'pp2464'},{doc:'tk'}],
 why:'Правила по охране труда при работе на высоте (приказ Минтруда № 782н) — специальный документ по этому виду работ: они определяют, когда работа относится к работам на высоте, когда требуется наряд-допуск и план производства работ, какие применяются системы обеспечения безопасности.',
 norm:{doc:'p782n', clause:'организация работ на высоте, наряд-допуск и системы обеспечения безопасности', exact:false,
   text:'Правила относят к работам на высоте работы, при которых существует риск падения с высоты, и устанавливают, что работы на высоте без применения средств подмащивания, а также на расстоянии менее 2 м от неограждённых перепадов по высоте более 1,8 м выполняются по наряду-допуску. Применяемые системы обеспечения безопасности должны иметь анкерные устройства, рассчитанные на соответствующие нагрузки.'},
 support:[{doc:'tk', clause:'Статья 214', exact:true,
   text:'Работодатель обязан обеспечить безопасность работников при выполнении работ и применение прошедших подтверждение соответствия средств индивидуальной защиты.'},
  {doc:'p766n', clause:'обеспечение и применение СИЗ', exact:false,
   text:'Правила обеспечения СИЗ требуют не только выдать средство защиты, но и обеспечить условия его применения, уход, проверку и своевременную замену.'}],
 apply:[
  'Шаг 1. Квалифицируем работу. Кровля без ограждения, перепад по высоте значительно больше 1,8 м — работа относится к работам на высоте с оформлением наряда-допуска.',
  'Шаг 2. Проверяем страховочную систему целиком. Привязь без анкерного устройства системой не является: выданное СИЗ, которое некуда закрепить, защиту не обеспечивает.',
  'Шаг 3. Проверяем документы на работу. Отсутствие наряда-допуска и плана производства работ означает, что опасности не оценены и мероприятия не назначены.',
  'Шаг 4. Учитываем подрядчика. Работы выполняются на объекте заказчика, поэтому порядок допуска подрядных организаций и контроль за ними — зона ответственности заказчика тоже.'],
 action:[
  'Остановить работы до оформления наряда-допуска и разработки плана производства работ.',
  'Обеспечить анкерные устройства или иные точки закрепления, проверить их состояние и допустимую нагрузку.',
  'Проверить наличие у работников обучения безопасным методам работ на высоте с соответствующей группой и медицинского допуска.',
  'Назначить ответственного за организацию и производство работ, обеспечить его присутствие на объекте.',
  'Включить в договор с подрядчиком порядок допуска, контроля и остановки работ при нарушениях.'],
 mistake:'Считать, что выданная привязь закрывает требование. Средство защиты работает только как система: привязь, строп, амортизатор и анкерное устройство вместе.',
 liability:{doc:'koap', clause:'части 1 и 4 статьи 5.27.1', exact:true,
   text:'Нарушение требований охраны труда и необеспечение работников средствами индивидуальной защиты влекут административную ответственность; при причинении тяжкого вреда здоровью наступает уголовная ответственность.'},
 remember:'Работы на высоте оцениваются по риску падения, а не по этажности. Нет точки закрепления — нет страховки, сколько бы привязей ни выдали.',
 quizDir:'ot'},

{id:'e7', dir:'prb', lvl:3, tag:'Опасный производственный объект',
 title:'Кран продолжает работать с истёкшим сроком службы без экспертизы',
 setting:'Литейный цех, мостовой кран грузоподъёмностью 10 т, введён в эксплуатацию в 1989 году. Объект зарегистрирован в реестре ОПО.',
 story:'Нормативный срок службы крана истёк. Экспертиза промышленной безопасности не проводилась: «кран в порядке, механик смотрит». Кран включён в производственный процесс, работает ежедневно. Сведения об изменении состава технических устройств в характеристики ОПО не вносились. Персонал допущен, но проверка знаний последний раз проводилась более трёх лет назад.',
 ask:'Какой документ определяет, можно ли эксплуатировать этот кран дальше?',
 opts:[{doc:'fnp461', ok:true},{doc:'fz116'},{doc:'koap'},{doc:'tk'}],
 why:'116-ФЗ задаёт общие обязанности эксплуатирующей организации, но конкретные требования к эксплуатации подъёмных сооружений, включая условия работы после истечения срока службы, устанавливают федеральные нормы и правила по подъёмным сооружениям.',
 norm:{doc:'fnp461', clause:'требования к эксплуатации подъёмных сооружений, отработавших нормативный срок службы', exact:false,
   text:'Федеральные нормы и правила устанавливают, что эксплуатация подъёмного сооружения, отработавшего назначенный срок службы, допускается только после проведения экспертизы промышленной безопасности и выполнения её выводов; эксплуатирующая организация обеспечивает техническое освидетельствование, обслуживание и допуск обученного персонала.'},
 support:[{doc:'fz116', clause:'Статья 9', exact:true,
   text:'Организация, эксплуатирующая опасный производственный объект, обязана соблюдать требования промышленной безопасности, обеспечивать проведение экспертизы промышленной безопасности, допускать к работе лиц, удовлетворяющих квалификационным требованиям и не имеющих медицинских противопоказаний, организовывать проведение подготовки и аттестации работников.'},
  {doc:'fz116', clause:'Статья 2', exact:true,
   text:'Опасные производственные объекты подлежат регистрации в государственном реестре; сведения об объекте должны соответствовать фактическому составу технических устройств.'}],
 apply:[
  'Шаг 1. Определяем ключевой юридический факт. Истечение назначенного срока службы — это не рекомендация к замене, а условие, при котором дальнейшая эксплуатация без экспертизы недопустима.',
  'Шаг 2. Отвечаем на довод «механик смотрит». Осмотр механика не заменяет ни техническое освидетельствование, ни экспертизу промышленной безопасности — это процедуры разного уровня с разным субъектом проведения.',
  'Шаг 3. Проверяем персонал. Работник, допущенный к обслуживанию технического устройства на ОПО, проходит подготовку и аттестацию в установленном порядке; просроченная проверка знаний — самостоятельное нарушение.',
  'Шаг 4. Проверяем реестр. Расхождение между фактическим составом технических устройств и сведениями в реестре ОПО — ещё одно самостоятельное нарушение.'],
 action:[
  'Вывести кран из эксплуатации до проведения экспертизы промышленной безопасности.',
  'Организовать экспертизу в установленном порядке и выполнить её выводы; заключение внести в реестр заключений.',
  'Провести техническое освидетельствование и привести в порядок эксплуатационную документацию.',
  'Организовать подготовку и аттестацию персонала, обслуживающего подъёмные сооружения.',
  'Проверить и при необходимости актуализировать сведения о составе технических устройств ОПО.'],
 mistake:'Подменять экспертизу промышленной безопасности внутренним осмотром или ремонтом. Ремонт может восстановить работоспособность, но право на дальнейшую эксплуатацию даёт только экспертиза.',
 liability:{doc:'koap', clause:'статья 9.1', exact:true,
   text:'Нарушение требований промышленной безопасности влечёт административную ответственность, включая штрафы на должностных лиц и организацию и административное приостановление деятельности; за грубое нарушение предусмотрены повышенные санкции.'},
 remember:'На опасном производственном объекте исправность и право на эксплуатацию — разные вещи. Второе подтверждается документом, а не состоянием техники.',
 quizDir:'prb'},

{id:'e8', dir:'eco', lvl:2, tag:'Отходы',
 title:'Отработанные люминесцентные лампы полтора года хранятся в подсобке',
 setting:'Торговый комплекс. Отходы I класса опасности — ртутьсодержащие лампы — складывают в картонную коробку в подсобном помещении.',
 story:'Первая партия ламп лежит с весны прошлого года: договор со специализированной организацией не заключён, «ждём, когда наберётся объём». Паспорта отходов I–IV классов не оформлены, журнал учёта в области обращения с отходами не ведётся. Коробка стоит рядом с упаковочным картоном, отдельного места накопления не выделено.',
 ask:'Какой документ определяет, что здесь нарушено?',
 opts:[{doc:'fz89', ok:true},{doc:'fz7'},{doc:'koap'},{doc:'pp1479'}],
 why:'Федеральный закон № 89-ФЗ регулирует обращение с отходами: накопление, учёт, паспортизацию, передачу лицензированным организациям. Закон № 7-ФЗ задаёт общие принципы охраны окружающей среды, а КоАП отвечает уже за последствия нарушения.',
 norm:{doc:'fz89', clause:'понятие накопления отходов и обязанности при обращении с ними', exact:false,
   text:'Накоплением признаётся складирование отходов на срок не более одиннадцати месяцев в целях их дальнейшей обработки, утилизации, обезвреживания или размещения. Отходы I–IV классов опасности подлежат паспортизации; деятельность по сбору, транспортированию, обработке, утилизации, обезвреживанию и размещению отходов I–IV классов подлежит лицензированию; хозяйствующие субъекты ведут учёт образовавшихся, переданных и размещённых отходов.'},
 support:[{doc:'fz7', clause:'общие требования в области охраны окружающей среды', exact:false,
   text:'Хозяйственная деятельность осуществляется с соблюдением требований в области охраны окружающей среды; обязанность обеспечить безопасное обращение с отходами — часть этих требований.'}],
 apply:[
  'Шаг 1. Считаем срок. Полтора года превышает предельный срок накопления в одиннадцать месяцев — накопление перестаёт быть накоплением и оценивается как размещение отходов, для которого нужны совсем другие основания.',
  'Шаг 2. Определяем класс опасности. Ртутьсодержащие лампы — отход I класса; требования к их накоплению, таре и месту накопления строже, чем к обычным отходам.',
  'Шаг 3. Проверяем документы. Отсутствие паспортов на отходы I–IV классов и журнала учёта — самостоятельные нарушения, независимые от срока хранения.',
  'Шаг 4. Смотрим на место. Картонная коробка рядом с горючей упаковкой — это ещё и вопрос пожарной безопасности и условий накопления, а не только экологии.'],
 action:[
  'Заключить договор с организацией, имеющей лицензию на обращение с отходами соответствующего класса, и передать накопленные лампы.',
  'Оборудовать место накопления отходов I класса: герметичная тара, отдельное помещение или выделенная зона, обозначение.',
  'Оформить паспорта на отходы I–IV классов опасности.',
  'Начать вести учёт в области обращения с отходами и назначить ответственного, имеющего соответствующую подготовку.',
  'Установить внутренний контроль срока накопления, чтобы предельный срок не истекал незаметно.'],
 mistake:'Ждать «пока наберётся объём». Срок накопления — самостоятельное требование, оно не зависит от того, выгодно ли вывозить малую партию.',
 liability:{doc:'koap', clause:'статья 8.2', exact:true,
   text:'Несоблюдение требований в области охраны окружающей среды при обращении с отходами производства и потребления влечёт административную ответственность, вплоть до административного приостановления деятельности; для отдельных случаев предусмотрены повышенные санкции.'},
 remember:'Одиннадцать месяцев — это не «примерно год». После этого срока хранение отхода меняет юридическую квалификацию.',
 quizDir:'eco'},

{id:'e9', dir:'ot', lvl:2, tag:'Замкнутые пространства',
 title:'Слесарь спустился в приямок очистных сооружений «на минуту»',

 ask:'Какой документ устанавливает порядок выполнения таких работ?',

 norm:{doc:'p902n', clause:'организация работ в ограниченных и замкнутых пространствах', exact:false,

   statusNote:'Срок действия правил и наличие последних изменений сверяйте на официальном портале правовой информации.'},
 support:[{doc:'tk', clause:'Статья 214', exact:true,
   text:'Работодатель обязан обеспечить безопасность работников и применение средств индивидуальной защиты, прошедших подтверждение соответствия.'},
  {doc:'p766n', clause:'обеспечение СИЗ', exact:false,
