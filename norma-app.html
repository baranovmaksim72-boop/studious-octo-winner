<script>
/* ============================================================
   МОДУЛЬ 6. ЯДРО: состояние, хранение, расчёт освоения
   ============================================================ */
const $ = s => document.querySelector(s);
const APP = $('#app'), LAYER = $('#layer');
const h = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = (arr,id) => arr.find(x=>x.id===id);
const DAY = 86400000;
const today = () => new Date().toISOString().slice(0,10);
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/DAY);

const DEFAULT_STATE = {
  v:1, onboarded:false,
  profile:{name:'', country:'RU', role:'', exp:'', dirs:['ot'], level:1, minutes:15},
  done:{},        // lessonId -> ISO date
  qstats:{},      // questionId -> {ok, bad, last, streak}
  srs:{},         // cardId -> {due, ivl, reps, lapses}
  practice:{},    // scenarioId/inspectionId -> {score, date}
  exams:[],       // {date, scope, score, total}
  saved:[],       // сохранённые темы
  xp:0, streak:0, lastDay:null, ach:[], readChanges:[], notes:{},
  plan:[]         // персональный план: [{week, courseId}]
};
let S = JSON.parse(JSON.stringify(DEFAULT_STATE));
let DB=null, USERID=null, SAMPLE=null, saveTimer=null, storageMode='local';

async function boot(){
  try{ const raw = localStorage.getItem('norma-state'); if(raw) S = merge(S, JSON.parse(raw)); }catch(e){}
  render();
  if(typeof window.claude?.use === 'function'){
    try{
      const user = await window.claude.use('user');
      const db = await window.claude.use('db');
      if(db){
        USERID = user ? await user.id() : null;
        DB = db;
        storageMode = 'cloud';
        const ref = DB.doc(statePath());
        const snap = await ref.get();
        if(snap.exists && snap.data() && snap.data().payload){
          S = merge(JSON.parse(JSON.stringify(DEFAULT_STATE)), JSON.parse(snap.data().payload));
          render();
        }
      }
    }catch(e){ storageMode='local'; }
    try{ SAMPLE = await window.claude.use('sample'); }catch(e){ SAMPLE = null; }
  }
  touchStreak();
}
function statePath(){ return USERID ? `data/users/${USERID}/state` : 'data/users/me/state'; }
function merge(base, add){ const o = {...base}; for(const k in add){ o[k] = (add[k] && typeof add[k]==='object' && !Array.isArray(add[k])) ? merge(base[k]||{}, add[k]) : add[k]; } return o; }
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ localStorage.setItem('norma-state', JSON.stringify(S)); }catch(e){}
    if(DB){ try{ await DB.doc(statePath()).set({payload:JSON.stringify(S), updated:new Date().toISOString()}); }catch(e){} }
  }, 400);
}
function touchStreak(){
  const t = today();
  if(S.lastDay === t) return;
  if(S.lastDay && daysBetween(S.lastDay, t) === 1) S.streak++;
  else if(S.lastDay) S.streak = 1; else S.streak = 1;
  S.lastDay = t; save();
}
function addXP(n){ S.xp += n; checkAch(); save(); }
function checkAch(){
  const add = id => { if(!S.ach.includes(id)){ S.ach.push(id); toast('Достижение: ' + byId(ACHIEVEMENTS,id).t); } };
  if(Object.keys(S.done).length >= 1) add('ac1');
  if(Object.keys(S.done).length >= 6) add('ac2');
  if(S.streak >= 7) add('ac3');
  const best = Object.values(S.qstats).reduce((m,v)=>Math.max(m,v.streak||0),0);
  if(best >= 20) add('ac4');
  if(Object.keys(S.practice).some(k=>k.startsWith('i'))) add('ac5');
  if(S.exams.some(e=>e.score/e.total>=0.8)) add('ac6');
}

/* ---------- уровень освоения темы ----------
   Не «гарантия знаний», а измеряемый показатель:
   теория 25% · тесты 40% · практика 20% · удержание 15%, с затуханием без повторения. */
function mastery(dir){
  const ls = LESSONS.filter(l => byId(COURSES,l.c).dir === dir);
  const theory = ls.length ? ls.filter(l=>S.done[l.id]).length / ls.length : 0;

  const qs = QUESTIONS.filter(q=>q.dir===dir);
  let w=0, got=0, lapses=0;
  qs.forEach(q=>{ const st=S.qstats[q.id]; if(!st||(!st.ok&&!st.bad)) return;
    const weight = q.diff; const total = st.ok+st.bad;
    w += weight; got += weight * (st.ok/total); if(st.bad>1) lapses++; });
  const coverage = qs.length ? Math.min(1, w / qs.reduce((a,q)=>a+q.diff,0)) : 0;
  const tests = w ? (got/w) * (0.55 + 0.45*coverage) : 0;

  const pr = [...SCENARIOS,...INSPECTIONS,...EXAMPLES].filter(p=>p.dir===dir);
  const practice = pr.length ? pr.filter(p=>S.practice[p.id]).length / pr.length : 0;

  const cards = CARDS.filter(c=>c.dir===dir);
  let ret=0;
  if(cards.length){
    const now = Date.now();
    ret = cards.reduce((a,c)=>{ const r=S.srs[c.id]; if(!r) return a;
      const overdue = (now - new Date(r.due).getTime())/DAY;
      return a + (overdue<=0 ? 1 : Math.max(0, 1 - overdue/14)); },0)/cards.length;
  }
  const penalty = Math.min(0.12, lapses*0.02);
  let m = 0.25*theory + 0.40*tests + 0.20*practice + 0.15*ret - penalty;

  const last = lastActivity(dir);
  if(last){ const idle = daysBetween(last, today()); if(idle>14) m *= Math.max(0.85, 1 - (idle-14)/200); }
  return Math.max(0, Math.min(1, m));
}
function lastActivity(dir){
  let d=null;
  LESSONS.filter(l=>byId(COURSES,l.c).dir===dir).forEach(l=>{ if(S.done[l.id] && (!d||S.done[l.id]>d)) d=S.done[l.id]; });
  QUESTIONS.filter(q=>q.dir===dir).forEach(q=>{ const st=S.qstats[q.id]; if(st?.last && (!d||st.last>d)) d=st.last; });
  return d;
}
function overall(){ const ds=Object.keys(DIRS).filter(d=>LESSONS.some(l=>byId(COURSES,l.c).dir===d));
  return ds.reduce((a,d)=>a+mastery(d),0)/ds.length; }
function weakest(n=3){
  return Object.keys(DIRS).filter(d=>COURSES.some(c=>c.dir===d))
    .map(d=>({d, m:mastery(d)})).sort((a,b)=>a.m-b.m).slice(0,n);
}
function pct(x){ return Math.round(x*100); }

/* ---------- интервальные повторения ---------- */
const IVL = [1,3,7,16,35,75];
function dueCards(){
  const now = Date.now();
  return CARDS.filter(c => {
    if(!S.profile.dirs.includes(c.dir) && S.profile.dirs.length) { /* показываем всё, но приоритет ниже */ }
    const r = S.srs[c.id];
    return !r || new Date(r.due).getTime() <= now;
  }).sort((a,b)=>{ const ra=S.srs[a.id], rb=S.srs[b.id];
    if(!ra) return -1; if(!rb) return 1; return new Date(ra.due)-new Date(rb.due); });
}
function gradeCard(id, grade){ // 0 не знаю · 1 плохо · 2 знаю · 3 отлично
  const r = S.srs[id] || {ivl:0, reps:0, lapses:0};
  if(grade===0){ r.ivl=0; r.lapses++; }
  else if(grade===1) r.ivl = Math.max(1, Math.round(IVL[Math.max(0,Math.min(IVL.length-1,r.reps))]*0.5));
  else { r.reps = Math.min(IVL.length-1, r.reps+1); r.ivl = IVL[r.reps] * (grade===3?1.3:1); }
  r.due = new Date(Date.now() + Math.max(1,Math.round(r.ivl))*DAY).toISOString();
  S.srs[id] = r; addXP(grade>=2?4:2);
}

/* ---------- уведомления ---------- */
function notifications(){
  const out = [];
  CHANGES.forEach(ch=>{ if(!S.readChanges.includes(ch.id)){
    const studied = (ch.affected||[]).some(a=>S.done[a] || S.qstats[a]);
    out.push({id:ch.id, kind:'change', sev:ch.sev, t:ch.title,
      d: studied ? 'Затронуты материалы, которые вы изучали. Проверьте новую редакцию.' : 'Изменение в нормативной базе по вашим направлениям.',
      go:()=>go('changes')});
  }});
  const due = dueCards().length;
  if(due>0) out.push({id:'srs', kind:'srs', sev:'mid', t:`К повторению готово карточек: ${due}`, d:'Повторение удерживает уровень освоения от снижения.', go:()=>go('review')});
  weakest(1).forEach(w=>{ if(w.m<0.7 && lastActivity(w.d)) out.push({id:'weak-'+w.d, kind:'weak', sev:'low',
    t:`Слабая тема: ${DIRS[w.d].t}`, d:`Уровень освоения ${pct(w.m)}%. Рекомендуется повторить и пройти тест.`, go:()=>go('test',{dir:w.d})}); });
  return out;
}

/* ---------- поиск ---------- */
function searchAll(qs){
  const q = qs.trim().toLowerCase(); if(q.length<2) return [];
  const words = q.split(/\s+/);
  const score = (txt, boost=1) => { const t=(txt||'').toLowerCase();
    let s=0; words.forEach(w=>{ if(t.includes(w)) s += (t.indexOf(w)<40?2:1); }); return s*boost; };
  const res = [];
  DOCS.forEach(d=>{ const s = score(d.title,2)+score(d.short,3)+score(d.num,3)+score(d.scope)+score((d.key||[]).join(' '));
    if(s) res.push({s, kind:'Документ', t:d.short, d:d.title, go:()=>go('doc',{id:d.id})}); });
  ARTICLES.forEach(a=>{ const s = score(a.title,2)+score(a.text)+score(a.simple)+score(a.practice)+score(a.remember,2);
    if(s) res.push({s, kind:'Пункт документа', t:a.title, d:byId(DOCS,a.doc).short+' · '+a.clause, go:()=>go('article',{id:a.id})}); });
  LESSONS.forEach(l=>{ const s = score(l.title,2)+score(l.goal)+score(JSON.stringify(l.blocks));
    if(s) res.push({s, kind:'Урок', t:l.title, d:byId(COURSES,l.c).title, go:()=>go('lesson',{id:l.id})}); });
  QUESTIONS.forEach(qq=>{ const s = score(qq.q)+score(qq.why);
    if(s) res.push({s:s*0.7, kind:'Вопрос', t:qq.q, d:'Тест · '+DIRS[qq.dir].t, go:()=>go('test',{dir:qq.dir})}); });
  CASES.forEach(c=>{ const s = score(c.title,2)+score(c.story);
    if(s) res.push({s, kind:'Кейс', t:c.title, d:DIRS[c.dir].t, go:()=>go('case',{id:c.id})}); });
  EXAMPLES.forEach(e=>{ const s = score(e.title,2)+score(e.story)+score(e.remember,2)+score(e.tag)+score(e.mistake);
    if(s) res.push({s, kind:'Разбор по примеру', t:e.title, d:DIRS[e.dir].t+' · '+byId(DOCS,e.norm.doc).short, go:()=>{ EX={id:e.id,sel:null,step:0}; go('example'); }}); });
  EXPERTS.forEach(x=>{ const s = score(x.thesis)+score(x.author);
    if(s) res.push({s:s*0.6, kind:'Мнение эксперта', t:x.thesis.slice(0,90)+'…', d:x.author, go:()=>go('experts')}); });
  return res.sort((a,b)=>b.s-a.s).slice(0,25);
}

/* ---------- аудио ---------- */
let speaking = false;
function speak(text, btn){
  if(!('speechSynthesis' in window)){ toast('Аудио недоступно в этом браузере'); return; }
  if(speaking){ window.speechSynthesis.cancel(); speaking=false; document.querySelectorAll('.audio-on').forEach(b=>b.classList.remove('audio-on')); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang='ru-RU'; u.rate=0.98;
  const v = window.speechSynthesis.getVoices().find(x=>/ru/i.test(x.lang));
  if(v) u.voice=v;
  u.onend = ()=>{ speaking=false; btn && btn.classList.remove('audio-on'); };
  speaking=true; btn && btn.classList.add('audio-on');
  window.speechSynthesis.speak(u);
}

/* ---------- AI-помощник ---------- */
const AI_RULES = `Ты — помощник внутри обучающего приложения по охране труда, промышленной, пожарной, электробезопасности и экологии.
ЖЁСТКИЕ ПРАВИЛА:
1) Не выдумывай нормативные документы, номера приказов, номера пунктов и формулировки. Ссылайся только на документы и пункты, переданные тебе в КОНТЕКСТЕ.
2) Если ответа нет в контексте — ответь: «Недостаточно данных для подтверждения. Проверьте официальный источник.» и объясни, где искать.
3) Не смешивай законодательство России, ЕАЭС и ЕС. Всегда указывай юрисдикцию.
4) Не выдавай мнение эксперта за норму.
5) Отвечай по-русски, коротко и практично.`;
async function ask(prompt, ctx, onText){
  if(!SAMPLE) return {err:'off'};
  try{
    const input = `${AI_RULES}\n\nКОНТЕКСТ (только эти данные считай подтверждёнными):\n${ctx}\n\nВОПРОС ПОЛЬЗОВАТЕЛЯ:\n${prompt}`;
    const r = await SAMPLE(input, {modelTier:'default', onText: onText ? ({text})=>onText(text) : undefined});
    return {text:r.text};
  }catch(e){ return {err:e.code||'error'}; }
}
function ctxForArticle(a){
  const d = byId(DOCS,a.doc);
  return `Документ: ${d.title} (${d.kind} ${d.num} от ${d.date}). Статус: ${statusText(d.status)}. Редакция: ${d.edition||'—'}. Юрисдикция: ${jurName(d.jur)}.
Пункт: ${a.clause}. ${a.mode==='verbatim'?'Официальная формулировка':'Изложение по первоисточнику (не цитата)'}: ${a.text}
Объяснение приложения: ${a.simple}
На практике: ${a.practice}
Типичные ошибки: ${(a.mistakes||[]).join('; ')}`;
}

/* ---------- вспомогательное ---------- */
function statusText(s){ return {active:'Действует', active_amended:'Действует с изменениями', check:'Требует проверки актуальности',
  repealed:'Утратил силу', replaced:'Заменён', draft:'Проект'}[s] || s; }
function statusClass(s){ return {active:'ok', active_amended:'ok', check:'warn', repealed:'bad', replaced:'bad', draft:'warn'}[s]||''; }
function jurName(j){ return {RU:'Россия', EAEU:'ЕАЭС', EU:'Европейский союз', DE:'Германия'}[j]||j; }
function jurFlag(j){ return {RU:'🇷🇺', EAEU:'🌍', EU:'🇪🇺', DE:'🇩🇪'}[j]||''; }
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}
function modal(html){
  LAYER.innerHTML = `<div class="modal-bg" data-close="1"><div class="modal">
    <button class="modal-x" id="modal-x" aria-label="Закрыть">✕</button>${html}</div></div>`;
  LAYER.querySelector('[data-close]').addEventListener('click', e=>{ if(e.target.dataset.close) closeModal(); });
  LAYER.querySelector('#modal-x').addEventListener('click', closeModal);
  LAYER.querySelector('.modal').focus?.();
}
function closeModal(){ LAYER.innerHTML=''; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && LAYER && LAYER.innerHTML) closeModal(); });
function sourceBtn(docId, clause){
  return `<button class="btn ghost sm" onclick="showSource('${docId}', ${clause?`'${clause.replace(/'/g,"\\'")}'`:'null'})">Откуда это?</button>`;
}
function showSource(docId, clause){
  const d = byId(DOCS, docId); if(!d) return;
  modal(`<h2 style="margin-top:0">Нормативное основание</h2>
   <div class="norm"><div class="lbl">🟦 ЗАКОНОДАТЕЛЬНОЕ ТРЕБОВАНИЕ</div>
    <b>${h(d.kind)} ${h(d.num)}</b><div style="margin-top:4px">${h(d.title)}</div></div>
   <dl class="kv">
    <dt>Пункт / статья</dt><dd>${h(clause||'документ в целом')}</dd>
    <dt>Дата принятия</dt><dd>${h(d.date)}</dd>
    <dt>Вступление в силу</dt><dd>${h(d.eff||'—')}</dd>
    <dt>Статус</dt><dd><span class="tag ${statusClass(d.status)}">${statusText(d.status)}</span></dd>
    <dt>Редакция</dt><dd>${h(d.edition||'—')}</dd>
    <dt>Территория</dt><dd>${jurFlag(d.jur)} ${h(d.territory||jurName(d.jur))}</dd>
    <dt>Орган</dt><dd>${h(d.authority||'—')}</dd>
    <dt>Официальный источник</dt><dd><a href="${h(d.source.url)}" target="_blank" rel="noopener">${h(d.source.name)}</a></dd>
    <dt>Сверка карточки</dt><dd>${h(d.verified)}</dd>
   </dl>
   ${d.note?`<div class="warnstripe">${h(d.note)}</div>`:''}
   <div class="row" style="margin-top:14px"><button class="btn" onclick="closeModal();go('doc',{id:'${d.id}'})">Открыть карточку документа</button>
   <button class="btn ghost" onclick="closeModal()">Закрыть</button></div>`);
}

<script>

 {sect:'Нормативная база'},

function render(){
  if(!S.onboarded){ APP.innerHTML = vOnboard(); bindOnboard(); return; }
  const unread = notifications().filter(n=>n.kind==='change').length;
  APP.innerHTML = `<div class="shell">
    <aside class="rail">
      <div class="brand"><div class="mark">Н</div><div><b>НОРМА</b><span>обучение требованиям безопасности</span></div></div>
      <nav class="nav">${NAV.map(n=> n.sect ? `<div class="sect">${n.sect}</div>` :
        `<button data-v="${n.v}" data-p='${JSON.stringify(n.p||{})}' aria-current="${R.v===n.v && JSON.stringify(n.p||{})===JSON.stringify(R.p)}">
          <span class="ic">${n.ic}</span>${n.t}${n.v==='changes'&&unread?`<span class="badge">${unread}</span>`:''}</button>`).join('')}
      </nav>
    </aside>
    <main class="main">
      <div class="topbar">
        <div class="mark">Н</div>
        <input class="searchbox" id="mobsearch" placeholder="Найти требование, документ, пункт" style="flex:1">
        <button class="btn ghost sm" data-v="progress">${pct(overall())}%</button>
      </div>
      ${view()}
    </main>
    <nav class="mobnav">${MOBNAV.map(n=>`<button data-v="${n.v}" aria-current="${R.v===n.v}"><span>${n.ic}</span>${n.t}</button>`).join('')}</nav>
  </div>`;
  APP.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>{
    const v=b.dataset.v; if(v==='more') return showMore();
    go(v, b.dataset.p?JSON.parse(b.dataset.p):{});

  const ms = $('#mobsearch');
  if(ms) ms.addEventListener('keydown', e=>{ if(e.key==='Enter') go('search',{q:ms.value}); });
  bindView();
}
function showMore(){
  modal(`<h2 style="margin-top:0">Разделы</h2><div class="list">
   ${NAV.filter(n=>!n.sect).map(n=>`<button class="item" data-mv="${n.v}" data-mp='${JSON.stringify(n.p||{})}'>
     <span>${n.ic}</span><span class="t">${n.t}</span></button>`).join('')}</div>`);
  LAYER.querySelectorAll('[data-mv]').forEach(b=>b.addEventListener('click',()=>{ closeModal(); go(b.dataset.mv, JSON.parse(b.dataset.mp)); }));
}
function view(){
  switch(R.v){
    case 'home': return vHome();
    case 'learn': return vLearn();
    case 'course': return vCourse();
    case 'lesson': return vLesson();
    case 'article': return vArticle();
    case 'docs': return vDocs();
    case 'doc': return vDoc();
    case 'test': return vTestHub();
    case 'quiz': return vQuiz();
    case 'review': return vReview();
    case 'daily': return vDaily();
    case 'practice': return vPractice();
    case 'examples': return vExamples();
    case 'example': return vExample();
    case 'inspect': return vInspect();
    case 'scenario': return vScenario();
    case 'case': return vCase();
    case 'changes': return vChanges();
    case 'experts': return vExperts();
    case 'ai': return vAI();
    case 'progress': return vProgress();
    case 'search': return vSearch();
    case 'compare': return vCompare();
    case 'arch': return vArch();
    default: return vHome();

/* ---------------- онбординг ---------------- */
function vOnboard(){
  return `<div class="main" style="max-width:640px;margin:0 auto">
   <div class="row" style="margin:18px 0 22px"><div class="mark">Н</div><b style="font-family:var(--display)">НОРМА</b></div>
   <h1>Научиться понимать требования, а не заучивать их</h1>
   <p class="lede">Приложение построено по схеме: норма → объяснение простыми словами → практика → ошибки → тест → повторение. Настроим программу под вас — это займёт минуту.</p>
   <div class="card">
     <h3>Страна и юрисдикция</h3>
     <div class="row" id="ob-country">${[['RU','🇷🇺 Россия'],['DE','🇩🇪 Германия'],['FR','🇪🇺 Франция'],['PL','🇪🇺 Польша'],['IT','🇪🇺 Италия'],['EU','🇪🇺 Другая страна ЕС']].map(([k,t],i)=>`<button class="chip" data-k="${k}" aria-pressed="${i===0}">${t}</button>`).join('')}</div>
     <h3>Опыт работы</h3>
     <div class="row" id="ob-exp">${['Начинаю с нуля','До 1 года','1–3 года','Более 3 лет'].map((t,i)=>`<button class="chip" data-k="${t}" aria-pressed="${i===0}">${t}</button>`).join('')}</div>
     <h3>Должность</h3>
     <div class="row" id="ob-role">${['Специалист по охране труда','Руководитель подразделения','Инженер / технический специалист','Работник','Студент'].map((t,i)=>`<button class="chip" data-k="${t}" aria-pressed="${i===0}">${t}</button>`).join('')}</div>
     <h3>Направления (можно несколько)</h3>
     <div class="row" id="ob-dirs">${Object.entries(DIRS).map(([k,v],i)=>`<button class="chip" data-k="${k}" aria-pressed="${k==='ot'}">${v.ic} ${v.t}</button>`).join('')}</div>
     <h3>Сколько времени в день</h3>
     <div class="row" id="ob-min">${[[15,'15 минут'],[30,'30 минут'],[60,'1 час']].map(([k,t],i)=>`<button class="chip" data-k="${k}" aria-pressed="${i===0}">${t}</button>`).join('')}</div>
     <div class="hr"></div>
     <button class="btn" id="ob-go">Сформировать программу</button>
   </div>
   <p class="tiny" style="margin-top:14px">Приложение не гарантирует юридически «уровень знаний» и не заменяет обязательное обучение в аккредитованной организации. Оно показывает измеряемый уровень освоения материала и всегда ведёт к первоисточнику.</p>
  </div>`;
}
function bindOnboard(){
  const pick = (sel, multi=false) => {
    const box = $(sel); if(!box) return;
    box.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
      if(multi){ c.setAttribute('aria-pressed', c.getAttribute('aria-pressed')!=='true'); }
      else { box.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false')); c.setAttribute('aria-pressed','true'); }
    }));
  };
  pick('#ob-country'); pick('#ob-exp'); pick('#ob-role'); pick('#ob-min'); pick('#ob-dirs', true);
  const val = sel => $(sel)?.querySelector('[aria-pressed="true"]')?.dataset.k;
  const vals = sel => [...($(sel)?.querySelectorAll('[aria-pressed="true"]')||[])].map(x=>x.dataset.k);
  $('#ob-go')?.addEventListener('click', ()=>{
    S.profile.country = val('#ob-country')||'RU';
    S.profile.exp = val('#ob-exp'); S.profile.role = val('#ob-role');
    S.profile.minutes = +(val('#ob-min')||15);
    S.profile.dirs = vals('#ob-dirs').length ? vals('#ob-dirs') : ['ot'];
    S.profile.level = S.profile.exp==='Начинаю с нуля' ? 1 : S.profile.exp==='Более 3 лет' ? 3 : 2;
    S.plan = buildPlan(); S.onboarded = true; save(); go('home');
  });
}
function buildPlan(){
  const jur = S.profile.country==='RU' ? 'RU' : 'EU';
  const mine = COURSES.filter(c=> (c.jur===jur||c.jur==='RU'&&jur==='RU') && S.profile.dirs.includes(c.dir));
  const rest = COURSES.filter(c=>!mine.includes(c));
  const ordered = [...mine.sort((a,b)=>a.lvl-b.lvl), ...rest];
  return ordered.map((c,i)=>({week:i+1, c:c.id}));
}

/* ---------------- главная ---------------- */
function vHome(){
  const notif = notifications();
  const next = nextLesson();
  const w = weakest(3);
  return `
  <div class="between" style="margin-bottom:14px">
    <div><h1>Главная</h1><p class="lede" style="margin:0">${h(S.profile.role||'Специалист')} · ${jurFlag(S.profile.country==='RU'?'RU':'EU')} ${h(countryName())} · серия ${S.streak} дн. · ${S.xp} XP</p></div>
    <div class="row"><button class="btn ghost sm" data-v="search">🔍 Поиск</button><button class="btn sm" data-v="daily">⏱ ${S.profile.minutes} минут сегодня</button></div>

    <div class="small">Общий уровень освоения</div>

    <div class="small">Показатель складывается из теории (25%), тестов с учётом сложности (40%), практических режимов (20%) и удержания через повторение (15%). Без повторения он снижается.</div>
  </div>
  ${notif.length?`<div class="list" style="margin-bottom:8px">${notif.slice(0,3).map(n=>`
    <button class="item" data-notif="${n.id}">
      <span>${n.kind==='change'?'⚠️':n.kind==='srs'?'🔄':'📉'}</span>
      <span><span class="t">${h(n.t)}</span><div class="small">${h(n.d)}</div></span><span class="spacer"></span><span>→</span></button>`).join('')}</div>`:''}
  <div class="grid g2">
    <div class="card">
      <h3 style="margin-top:0">Продолжить обучение</h3>
      ${next?`<div class="small">${h(byId(COURSES,next.c).title)}</div>
        <div style="font-weight:600;margin:4px 0 10px">${h(next.title)}</div>
        <button class="btn" data-lesson="${next.id}">Открыть урок</button>`:`<p class="small">Все уроки пройдены. Проверьте себя на итоговой аттестации.</p><button class="btn" data-v="test">К экзаменам</button>`}
    </div>
    <div class="card">
      <h3 style="margin-top:0">Мои слабые темы</h3>
      ${w.map(x=>`<div style="margin-bottom:8px"><div class="between" style="margin-bottom:3px"><span>${DIRS[x.d].ic} ${DIRS[x.d].t}</span><b class="num">${pct(x.m)}%</b></div>
        <div class="bar"><i style="width:${pct(x.m)}%;background:${x.m<0.5?'var(--red)':x.m<0.75?'var(--amber)':'var(--green)'}"></i></div></div>`).join('')}
      <button class="btn ghost sm" data-v="test" style="margin-top:6px">Тренировать слабые темы</button>
    </div>
  </div>
  ${(()=>{ const ex = EXAMPLES.find(x=>!S.practice[x.id]) || EXAMPLES[0]; const d = byId(DOCS, ex.norm.doc);
    return `<h2>Разбор по примеру</h2>
    <div class="card"><div class="tiny">${DIRS[ex.dir].ic} ${DIRS[ex.dir].t} · ${h(ex.tag)}</div>
      <h3 style="margin:4px 0 6px">${h(ex.title)}</h3>
      <p class="small">${h(ex.setting)}</p>
      <div class="row"><button class="btn" data-example="${ex.id}">Разобрать ситуацию</button>
        <button class="btn ghost" data-v="examples">Все примеры</button></div>
      <div class="tiny" style="margin-top:8px">Применяется: ${h(d.kind)} ${h(d.num)} — но сначала вы решаете сами.</div></div>`; })()}
  <h2>Что изменилось в законодательстве</h2>
  <div class="list">${CHANGES.slice(0,3).map(c=>`<button class="item" data-change="${c.id}">
     <span class="tag ${c.sev==='high'?'bad':'warn'}">${c.date}</span>
     <span><span class="t">${h(c.title)}</span><div class="small">${h(byId(DOCS,c.doc).short)}</div></span><span class="spacer"></span><span>→</span></button>`).join('')}</div>
  <h2>Разделы</h2>
  <div class="grid g3">
    ${[['examples','🧾','Обучение по примеру', EXAMPLES.length+' разборов с нормой'],
       ['review','🔄','Повторение', dueCards().length+' карточек готово'],
       ['practice','🧠','Практика','Инспектор · специалист · кейсы'],
       ['test','📝','Тесты и экзамены','Еженедельный и итоговый'],
       ['docs','📖','Нормативная база', DOCS.length+' документов'],
       ['experts','💬','Мнения и практика','Отделены от норм'],
       ['compare','🌍','Россия / ЕАЭС / ЕС','Без смешивания требований']]
      .map(([v,ic,t,d])=>`<button class="item" data-v="${v}"><span>${ic}</span><span><span class="t">${t}</span><div class="small">${d}</div></span></button>`).join('')}
  </div>`;
}
function countryName(){ return {RU:'Россия',DE:'Германия',FR:'Франция',PL:'Польша',IT:'Италия',EU:'ЕС'}[S.profile.country]||'Россия'; }
function nextLesson(){
  for(const p of (S.plan.length?S.plan:COURSES.map(c=>({c:c.id})))){
    const l = LESSONS.filter(x=>x.c===p.c).sort((a,b)=>a.n-b.n).find(x=>!S.done[x.id]);
    if(l) return l;
  }
  return LESSONS.find(l=>!S.done[l.id]);
}

/* ---------------- обучение ---------------- */
function vLearn(){
  const plan = S.plan.length?S.plan:COURSES.map((c,i)=>({week:i+1,c:c.id}));
  return `<h1>Обучение</h1>
  <p class="lede">Персональная программа собрана по вашим направлениям и опыту. Порядок можно не соблюдать — открывайте любой курс.</p>
  <div class="list">${plan.map(p=>{
    const c = byId(COURSES,p.c); if(!c) return '';
    const ls = LESSONS.filter(l=>l.c===c.id); const done = ls.filter(l=>S.done[l.id]).length;
    return `<button class="item" data-course="${c.id}">
      <span>${DIRS[c.dir].ic}</span>
      <span style="flex:1">
        <div class="tiny">Неделя ${p.week} · ${jurFlag(c.jur)} ${jurName(c.jur)} · уровень ${c.lvl}</div>
        <span class="t">${h(c.title)}</span>
        <div class="small">${h(c.about)}</div>
        <div class="bar" style="margin-top:7px;max-width:260px"><i style="width:${ls.length?Math.round(done/ls.length*100):0}%"></i></div>
      </span>
      <span class="small">${done}/${ls.length}</span></button>`;}).join('')}</div>`;
}
function vCourse(){
  const c = byId(COURSES, R.p.id); if(!c) return vLearn();
  const ls = LESSONS.filter(l=>l.c===c.id).sort((a,b)=>a.n-b.n);
  const qn = QUESTIONS.filter(q=>q.c===c.id).length;
  return `<button class="btn ghost sm" data-v="learn">← Обучение</button>
  <h1 style="margin-top:12px">${h(c.title)}</h1>
  <p class="lede">${h(c.about)}</p>
  <div class="row" style="margin-bottom:14px">
    <span class="tag">${DIRS[c.dir].ic} ${DIRS[c.dir].t}</span>
    <span class="tag law">${jurFlag(c.jur)} ${jurName(c.jur)}</span>
    <span class="tag">Уровень ${c.lvl}</span><span class="tag">${ls.length} уроков</span><span class="tag">${qn} вопросов</span>
  </div>
  <div class="list">${ls.map(l=>`<button class="item" data-lesson="${l.id}">
    <span class="tag ${S.done[l.id]?'ok':''}">${S.done[l.id]?'✓':l.n}</span>
    <span style="flex:1"><span class="t">${h(l.title)}</span><div class="small">${h(l.goal)}</div></span>
    <span class="small">${l.kind==='test'?'тест':l.kind==='practice'?'практика':l.kind==='review'?'повторение':'теория'}</span></button>`).join('')}</div>
  <div class="row" style="margin-top:14px">
    <button class="btn" data-quiz='${JSON.stringify({course:c.id})}'>Пройти тест по курсу</button>
    <button class="btn ghost" data-v="review">К повторению</button>
  </div>`;
}
function vLesson(){
  const l = byId(LESSONS, R.p.id); if(!l) return vLearn();
  const c = byId(COURSES, l.c);
  const audio = [l.title, l.goal, ...(l.blocks||[]).map(b=>(b.h?b.h+'. ':'')+(b.p||(b.list||[]).join('. ')))].join(' ');
  return `<button class="btn ghost sm" data-course="${c.id}">← ${h(c.title)}</button>
  <h1 style="margin-top:12px">${h(l.title)}</h1>
  <p class="lede">Цель урока: ${h(l.goal)}</p>
  <div class="row" style="margin-bottom:14px">
    <button class="btn soft sm" id="play-lesson">▶ Слушать</button>
    ${l.video.status==='none'
      ? `<span class="tag warn">Видео не добавлено</span>`
      : `<button class="btn ghost sm" id="video-script">🎬 Сценарий видео</button><span class="tag warn">Учебный материал приложения</span>`}
    <button class="btn ghost sm" data-save="${l.id}">${S.saved.includes(l.id)?'★ Сохранено':'☆ Сохранить тему'}</button>
  </div>
  ${(l.blocks||[]).map(b=>`<div class="expl"><h4>${h(b.h)}</h4>${b.p?`<p>${h(b.p)}</p>`:''}${b.list?`<ul>${b.list.map(x=>`<li>${h(x)}</li>`).join('')}</ul>`:''}</div>`).join('')}
  ${l.chain&&l.chain.length?`<h2>Откуда происходит требование</h2>${chainHTML(l.chain)}`:''}
  ${(l.arts||[]).map(id=>articleHTML(byId(ARTICLES,id))).join('')}
  <div class="hr"></div>
  <div class="row">
    <button class="btn" data-done="${l.id}">${S.done[l.id]?'Пройдено ✓ — отметить заново':'Отметить как изученное'}</button>
    <button class="btn ghost" data-quiz='${JSON.stringify({course:l.c})}'>Проверить себя</button>
    <button class="btn ghost" data-ai="${l.id}">🤖 Спросить по уроку</button>
  </div>`;
}
function chainHTML(chain){
  return `<div class="chain">${chain.map((s,i)=>`${i?'<div class="arw"></div>':''}
    <div class="step"><b>${h(s.lbl)}</b>${h(s.txt)}</div>`).join('')}</div>`;
}
function articleHTML(a){
  if(!a) return '';
  const d = byId(DOCS, a.doc);
  return `<div class="card" style="margin:16px 0">
    <div class="between"><h3 style="margin:0">${h(a.title)}</h3>
      <span class="tag ${statusClass(d.status)}">${statusText(d.status)}</span></div>
    <div class="norm">
      <div class="lbl">🟦 ЗАКОНОДАТЕЛЬНОЕ ТРЕБОВАНИЕ · ${h(d.short)} · ${h(a.clause)}
        <span class="tag ${a.mode==='verbatim'?'law':''}">${a.mode==='verbatim'?'официальная формулировка':'изложение по первоисточнику'}</span></div>
      <blockquote>${h(a.text)}</blockquote>
      <div class="row" style="margin-top:10px">${sourceBtn(a.doc, a.clause)}
        <button class="btn ghost sm" onclick="speak(${JSON.stringify(a.text).replace(/"/g,'&quot;')}, this)">▶ Слушать норму</button></div>
      ${a.mode!=='verbatim'?`<div class="tiny" style="margin-top:8px">Текст изложен в сокращении и не является дословной цитатой. Точная формулировка — в официальном источнике.</div>`:''}
    </div>
    <div class="expl"><h4>Простыми словами · объяснение приложения</h4><p>${h(a.simple)}</p></div>
    <div class="expl"><h4>Что это означает на предприятии</h4><p>${h(a.practice)}</p></div>
    <div class="expl"><h4>Пример</h4><p>${h(a.example)}</p></div>
    <div class="expl"><h4>Типичные ошибки</h4><ul>${(a.mistakes||[]).map(m=>`<li>${h(m)}</li>`).join('')}</ul></div>
    <div class="warnstripe"><b>Важно.</b> ${h(a.inspector)}</div>
    <div class="expl" style="border-left-color:var(--blue)"><h4>Запомни</h4><p><b>${h(a.remember)}</b></p></div>
    <div class="row">
      <button class="btn ghost sm" data-explain="${a.id}">Объясни проще</button>
      <button class="btn ghost sm" data-example="${a.id}">Приведи пример с предприятия</button>
      <button class="btn ghost sm" data-check="${a.id}">Проверь мои знания</button>
      <button class="btn ghost sm" data-links="${a.id}">Связи с другими документами</button>
    </div>
    <div id="ai-${a.id}"></div>
  </div>`;
}
function vArticle(){
  const a = byId(ARTICLES, R.p.id); if(!a) return vDocs();
  return `<button class="btn ghost sm" data-doc="${a.doc}">← ${h(byId(DOCS,a.doc).short)}</button>
    <h1 style="margin-top:12px">${h(a.title)}</h1>${articleHTML(a)}`;
}

/* ---------------- нормативная база ---------------- */
function vDocs(){
  const f = R.p;
  let list = DOCS.slice();
  if(f.dir) list = list.filter(d=>d.dir.includes(f.dir));
  if(f.jur) list = list.filter(d=>d.jur===f.jur || (f.jur==='EU'&&d.jur==='DE'));
  if(f.q) list = list.filter(d=>(d.title+d.short+d.num).toLowerCase().includes(f.q.toLowerCase()));
  const chip=(k,val,t)=>`<button class="chip" data-filter='${JSON.stringify({[k]:val})}' aria-pressed="${f[k]===val}">${t}</button>`;
  return `<h1>Нормативная база</h1>
  <p class="lede">${DOCS.length} документов. Каждая карточка хранит паспорт документа, статус, редакцию и ссылку на официальный источник. Требования России, ЕАЭС и ЕС не смешиваются.</p>
  <input class="searchbox" id="doc-search" placeholder="Название, номер, ключевое слово" value="${h(f.q||'')}" style="margin-bottom:10px">
  <div class="row" style="margin-bottom:6px">${chip('jur',null,'Все юрисдикции')}${chip('jur','RU','🇷🇺 Россия')}${chip('jur','EAEU','🌍 ЕАЭС')}${chip('jur','EU','🇪🇺 ЕС')}</div>
  <div class="row" style="margin-bottom:14px">${chip('dir',null,'Все направления')}${Object.entries(DIRS).filter(([k])=>DOCS.some(d=>d.dir.includes(k))).map(([k,v])=>chip('dir',k,v.ic+' '+v.t)).join('')}</div>
  <div class="list">${list.map(d=>`<button class="item" data-doc="${d.id}">
    <span style="min-width:74px"><span class="tag ${statusClass(d.status)}">${statusText(d.status).split(' ')[0]}</span></span>
    <span style="flex:1"><div class="tiny">${jurFlag(d.jur)} ${h(d.kind)} ${h(d.num)} от ${h(d.date)}</div>
      <span class="t">${h(d.short)}</span><div class="small">${h(d.title.slice(0,120))}${d.title.length>120?'…':''}</div></span>
    <span class="small">${d.dir.map(x=>DIRS[x]?DIRS[x].ic:'').join('')}</span></button>`).join('')}</div>
  ${list.length?'':'<p class="small">Ничего не найдено. Измените фильтры.</p>'}`;
}
function vDoc(){
  const d = byId(DOCS, R.p.id); if(!d) return vDocs();
  const arts = ARTICLES.filter(a=>a.doc===d.id);
  const lessons = LESSONS.filter(l=>(l.arts||[]).some(a=>arts.some(x=>x.id===a)));
  const changes = CHANGES.filter(c=>c.doc===d.id);
  const exp = EXPERTS.filter(x=>x.doc===d.id);
  return `<button class="btn ghost sm" data-v="docs">← Нормативная база</button>
  <h1 style="margin-top:12px">${h(d.short)}</h1>
  <p class="lede">${h(d.title)}</p>
  <div class="row" style="margin-bottom:12px">
    <span class="tag ${statusClass(d.status)}">${statusText(d.status)}</span>
    <span class="tag law">${jurFlag(d.jur)} ${jurName(d.jur)}</span>
    ${d.dir.map(x=>DIRS[x]?`<span class="tag">${DIRS[x].ic} ${DIRS[x].t}</span>`:'').join('')}
  </div>
  ${d.statusNote?`<div class="warnstripe"><b>Актуальность не подтверждена полностью.</b> ${h(d.statusNote)}</div>`:''}
  ${d.note?`<div class="warnstripe">${h(d.note)}</div>`:''}
  <div class="card">
    <dl class="kv">
      <dt>Вид документа</dt><dd>${h(d.kind)}</dd>
      <dt>Номер</dt><dd>${h(d.num)}</dd>
      <dt>Дата принятия</dt><dd>${h(d.date)}</dd>
      <dt>Вступление в силу</dt><dd>${h(d.eff||'—')}</dd>
      <dt>Редакция</dt><dd>${h(d.edition||'—')}</dd>
      <dt>Орган</dt><dd>${h(d.authority||'—')}</dd>
      <dt>Территория действия</dt><dd>${h(d.territory||jurName(d.jur))}</dd>
      <dt>Официальный источник</dt><dd><a href="${h(d.source.url)}" target="_blank" rel="noopener">${h(d.source.name)}</a></dd>
      <dt>Сверка карточки</dt><dd>${h(d.verified)}</dd>
    </dl>
  </div>
  <h2>Для чего нужен</h2><p>${h(d.scope)}</p>
  <h2>На кого распространяется</h2><p>${h(d.who)}</p>
  <h2>Самые важные пункты</h2><ul>${(d.key||[]).map(k=>`<li>${h(k)}</li>`).join('')}</ul>
  ${arts.length?`<h2>Разобранные пункты</h2>${arts.map(a=>articleHTML(a)).join('')}`:`<div class="card"><p class="small" style="margin:0">Отдельные пункты этого документа ещё не разобраны в учебном формате. Структура базы позволяет добавить их без изменения кода: документ → пункт → объяснение → тест.</p></div>`}
  <h2>Связи с другими документами</h2>
  ${graphHTML(d)}
  <div class="list" style="margin-top:10px">${(d.related||[]).map(id=>{const r=byId(DOCS,id); return r?`<button class="item" data-doc="${r.id}"><span class="tag ${statusClass(r.status)}">${jurFlag(r.jur)}</span><span><span class="t">${h(r.short)}</span><div class="small">${h(r.kind)} ${h(r.num)}</div></span></button>`:''}).join('')}</div>
  ${changes.length?`<h2>Изменения</h2><div class="list">${changes.map(c=>`<button class="item" data-change="${c.id}"><span class="tag warn">${c.date}</span><span class="t">${h(c.title)}</span></button>`).join('')}</div>`:''}
  ${exp.length?`<h2>Мнения экспертов по этому документу</h2>${exp.map(expertHTML).join('')}`:''}
  <div class="hr"></div>
  <div class="row">
    ${lessons.length?`<button class="btn" data-lesson="${lessons[0].id}">Изучить в учебном формате</button>`:''}
    <button class="btn ghost" data-quiz='${JSON.stringify({doc:d.id})}'>Тест по документу</button>
    <a class="btn ghost" href="${h(d.source.url)}" target="_blank" rel="noopener" style="text-decoration:none">Открыть официальный источник</a>
  </div>`;
}
function graphHTML(d){
  const nodes = [d.id, ...(d.related||[])].map(id=>byId(DOCS,id)).filter(Boolean).slice(0,6);
  const W=640, H=60+nodes.length*0, cy=110;
  const R0=86;
  const pts = nodes.slice(1).map((n,i)=>{ const ang = Math.PI*(0.15 + 0.7*(i/(Math.max(1,nodes.length-2)||1)));
    return {n, x: W/2 + Math.cos(ang+Math.PI)* (W/2-90), y: 30 + (i%2? 0:150)}; });
  return `<svg class="graph" viewBox="0 0 ${W} 220" role="img" aria-label="Схема связей документов">
   ${pts.map(p=>`<line x1="${W/2}" y1="${cy}" x2="${p.x}" y2="${p.y+22}" stroke="var(--line)" stroke-width="2"/>`).join('')}
   ${pts.map(p=>`<g><rect x="${p.x-80}" y="${p.y}" width="160" height="44" rx="8" fill="var(--card)" stroke="var(--line)"/>
     <text x="${p.x}" y="${p.y+20}" text-anchor="middle" font-size="12" font-family="Golos Text,sans-serif" fill="var(--ink)">${h(p.n.short.slice(0,22))}</text>
     <text x="${p.x}" y="${p.y+35}" text-anchor="middle" font-size="10" font-family="Golos Text,sans-serif" fill="var(--muted)">${h(p.n.kind.slice(0,24))}</text></g>`).join('')}
   <rect x="${W/2-92}" y="${cy-24}" width="184" height="50" rx="9" fill="var(--blue-soft)" stroke="var(--blue)" stroke-width="2"/>
   <text x="${W/2}" y="${cy-2}" text-anchor="middle" font-size="13" font-weight="600" font-family="Golos Text,sans-serif" fill="var(--blue)">${h(d.short.slice(0,24))}</text>
   <text x="${W/2}" y="${cy+15}" text-anchor="middle" font-size="10" font-family="Golos Text,sans-serif" fill="var(--blue)">${h(d.num)}</text>
  </svg>`;
}
</script>
<script>
/* ============================================================
   МОДУЛЬ: ОБУЧЕНИЕ ПО ПРИМЕРУ (представление)
   Пошаговый разбор: ситуация → выбор документа → норма →
   применение → действия → ошибка → ответственность → запомни.
   ============================================================ */
let EX = {id:null, sel:null, step:0};

const EX_STEPS = ['Ситуация','Норма','Разбор','Действия','Вывод'];

function vExamples(){
  const byDir = {};
  EXAMPLES.forEach(e=>{ (byDir[e.dir] = byDir[e.dir] || []).push(e); });
  const doneN = EXAMPLES.filter(e=>S.practice[e.id]).length;
  return `<h1>Обучение по примеру</h1>
  <p class="lede">Каждый разбор начинается с конкретной производственной ситуации. Сначала вы решаете, какой документ применяется,
   и только потом видите норму, разбор по шагам, порядок действий и ответственность. Так требование запоминается вместе с ситуацией, в которой оно работает.</p>
  <div class="hero" style="margin-bottom:18px">
    <div class="small">Разобрано примеров</div>
    <div class="v">${doneN} / ${EXAMPLES.length}</div>
    <div class="small" style="margin-top:8px">Разбор засчитывается в практическую часть уровня освоения.</div></div>
  ${Object.entries(byDir).map(([d,list])=>`
    <h2>${DIRS[d].ic} ${DIRS[d].t}</h2>
    <div class="list">${list.map(e=>{
      const done = S.practice[e.id];
      const doc = byId(DOCS, e.norm.doc);
      return `<button class="item" data-example="${e.id}">
        <span class="tag ${done?'ok':''}">${done?'✓':'●'.repeat(e.lvl)}</span>
        <span style="flex:1"><span class="t">${h(e.title)}</span>
          <div class="small">${h(e.tag)} · применяется ${h(doc.kind)} ${h(doc.num)}</div></span></button>`;
    }).join('')}</div>`).join('')}
  <div class="expl" style="margin-top:18px"><h4>Как читать эти разборы</h4>
   <p>Синим отмечено законодательное требование, жёлтым — объяснение приложения. Если у пункта указан точный номер, он назван прямо;
    если в первоисточнике нужно уточнить номер пункта, приложение об этом прямо пишет и ведёт к документу.</p></div>`;
}

function vExample(){
  const e = byId(EXAMPLES, EX.id); if(!e) return vExamples();
  const picked = EX.sel !== null;
  const right = picked && e.opts[EX.sel] && e.opts[EX.sel].ok;
  const correctIdx = e.opts.findIndex(o=>o.ok);
  const normDoc = byId(DOCS, e.norm.doc);

  const docChip = (docId, clause, exact) => {
    const d = byId(DOCS, docId);
    return `<div class="tiny" style="margin-bottom:4px">${jurFlag(d.jur)} ${h(d.kind)} ${h(d.num)}
      <span class="tag ${statusClass(d.status)}">${statusText(d.status)}</span></div>
      <b>${h(d.short)}</b> · ${h(clause)}
      ${exact===false?`<div class="tiny" style="margin-top:3px">Назван раздел документа. Точный номер пункта сверьте в первоисточнике — приложение не подставляет номера, в которых не уверено.</div>`:''}`;
  };

  let html = `<button class="btn ghost sm" data-v="examples">← Обучение по примеру</button>
  <div class="tiny" style="margin-top:12px">${DIRS[e.dir].ic} ${DIRS[e.dir].t} · ${h(e.tag)}</div>
  <h1 style="margin:4px 0 6px">${h(e.title)}</h1>
  <div class="row" style="gap:6px;margin-bottom:14px">${EX_STEPS.map((s,i)=>
    `<span class="chip" aria-pressed="${i<=EX.step}" style="pointer-events:none">${s}</span>`).join('')}</div>

  <div class="card"><h3 style="margin-top:0">Ситуация</h3>
    <p class="small" style="color:var(--muted)">${h(e.setting)}</p>
    <p>${h(e.story)}</p></div>`;

  /* ---- шаг 0: выбор применяемого документа ---- */
  html += `<h2>${h(e.ask)}</h2>
  <div class="list">${e.opts.map((o,i)=>{
    const d = byId(DOCS, o.doc);
    const state = picked ? (o.ok ? 'ok' : (EX.sel===i ? 'bad' : '')) : (EX.sel===i ? 'sel' : '');
    return `<button class="quiz-opt" data-exopt="${i}" data-state="${state}">
      <span class="mk">${picked && o.ok ? '✓' : (picked && EX.sel===i ? '✕' : '')}</span>
      <span><b>${h(d.short)}</b><div class="tiny">${h(d.kind)} ${h(d.num)}</div></span></button>`;
  }).join('')}</div>`;

  if(!picked){
    html += `<p class="tiny">Сначала решите сами — разбор откроется после ответа.</p>`;
    return html;
  }

  html += `<div class="${right?'expl':'warnstripe'}" style="margin-top:12px">
    <h4>${right?'Верно':'Не этот документ'}</h4>
    ${right?'':`<p><b>Применяется:</b> ${h(byId(DOCS, e.opts[correctIdx].doc).short)}.</p>`}
    <p>${h(e.why)}</p></div>`;

  /* ---- шаг 1: норма ---- */
  if(EX.step >= 1){
    html += `<h2>Норма, которая применяется</h2>
    <div class="norm"><div class="lbl">🟦 ЗАКОНОДАТЕЛЬНОЕ ТРЕБОВАНИЕ</div>
      ${docChip(e.norm.doc, e.norm.clause, e.norm.exact)}
      <p style="margin-top:8px">${h(e.norm.text)}</p>
      <div class="tiny" style="margin-top:6px">Изложение по первоисточнику, не дословная цитата.</div>
      ${e.norm.statusNote?`<div class="tiny" style="margin-top:6px"><b>Проверьте актуальность.</b> ${h(e.norm.statusNote)}</div>`:''}
      ${e.norm.note?`<div class="tiny" style="margin-top:6px">${h(e.norm.note)}</div>`:''}
      <div class="row" style="margin-top:10px">${sourceBtn(e.norm.doc, e.norm.exact===false?null:e.norm.clause)}
        <button class="btn ghost sm" data-doc="${e.norm.doc}">Карточка документа</button></div></div>`;

    if(e.support && e.support.length){
      html += `<h3>Что применяется вместе с ней</h3>
      ${e.support.map(s=>`<div class="card" style="margin-bottom:10px">
        ${docChip(s.doc, s.clause, s.exact)}
        <p class="small" style="margin-top:8px">${h(s.text)}</p>
        <div class="row">${sourceBtn(s.doc, s.exact===false?null:s.clause)}
          <button class="btn ghost sm" data-doc="${s.doc}">Открыть документ</button></div></div>`).join('')}`;
    }
  }

  /* ---- шаг 2: разбор по шагам ---- */
  if(EX.step >= 2){
    html += `<h2>Как норма ложится на эту ситуацию</h2>
    <div class="list">${e.apply.map((x,i)=>`<div class="item" style="cursor:default">
      <span class="mk">${i+1}</span><span>${h(x)}</span></div>`).join('')}</div>`;
  }

  /* ---- шаг 3: действия ---- */
  if(EX.step >= 3){
    html += `<h2>Что должен сделать специалист</h2>
    <ul>${e.action.map(x=>`<li>${h(x)}</li>`).join('')}</ul>`;
  }

  /* ---- шаг 4: ошибка, ответственность, вывод ---- */
  if(EX.step >= 4){
    const lawDoc = byId(DOCS, e.liability.doc);
    html += `<h2>Частая ошибка</h2>
    <div class="warnstripe"><p>${h(e.mistake)}</p></div>
    <h2>Чем это заканчивается</h2>
    <div class="card" style="border-left:3px solid var(--red)">
      ${docChip(e.liability.doc, e.liability.clause, e.liability.exact)}
      <p class="small" style="margin-top:8px">${h(e.liability.text)}</p>
      <div class="tiny">Конкретный размер санкции зависит от состава нарушения, субъекта и повторности — он определяется по действующей редакции ${h(lawDoc.short)}.</div>
      <div class="row" style="margin-top:8px">${sourceBtn(e.liability.doc, e.liability.clause)}</div></div>
    <div class="norm" style="margin-top:16px"><div class="lbl">🟦 ЗАПОМНИ</div><p style="margin:0"><b>${h(e.remember)}</b></p></div>`;
  }

  /* ---- управление ---- */
  const labels = ['Показать норму','Как это применяется','Что делать специалисту','Вывод и ответственность'];
  html += `<div class="row" style="margin-top:18px">`;
  if(EX.step < 4){
    html += `<button class="btn" id="ex-next">${labels[EX.step]}</button>`;
  } else {
    html += `<button class="btn" data-exdone="${e.id}">Разбор завершён</button>
      <button class="btn ghost" data-quiz='${JSON.stringify({dir:e.quizDir, n:5})}'>Проверить себя по теме</button>
      <button class="btn ghost" data-exnext="1">Следующий пример</button>`;
  }
  const spoken = (e.story + (EX.step>=1 ? ' Норма. ' + e.norm.text : '')).slice(0,700);
  html += `<button class="btn ghost" onclick="speak(${JSON.stringify(spoken).replace(/"/g,'&quot;')}, this)">▶ Слушать</button></div>`;
  return html;
}

function bindExamples(){
  const on = (sel, ev, fn) => APP.querySelectorAll(sel).forEach(x=>x.addEventListener(ev, fn));
  on('[data-example]','click', ev=>{ EX = {id: ev.currentTarget.dataset.example, sel:null, step:0}; go('example'); });
  on('[data-exopt]','click', ev=>{ if(EX.sel!==null) return; EX.sel = +ev.currentTarget.dataset.exopt; EX.step = 0; render(); });
  const n = $('#ex-next'); if(n) n.addEventListener('click', ()=>{ EX.step++; render(); });
  on('[data-exdone]','click', ev=>{
    const id = ev.currentTarget.dataset.exdone;
    const e = byId(EXAMPLES, id);
    const score = e.opts[EX.sel] && e.opts[EX.sel].ok ? 100 : 60;
    S.practice[id] = {score, date: today()};
    addXP(12); save();
    toast('Разбор засчитан в практику');
    go('examples');
  });
  on('[data-exnext]','click', ()=>{
    const i = EXAMPLES.findIndex(x=>x.id===EX.id);
    const next = EXAMPLES[(i+1) % EXAMPLES.length];
    EX = {id: next.id, sel:null, step:0}; go('example');
  });
}

<script>
/* ============================================================
   МОДУЛЬ 8. ТЕСТИРОВАНИЕ
   ============================================================ */
let QZ = null;
function pickQuestions(cfg){
  let pool = QUESTIONS.slice();
  if(cfg.course) pool = pool.filter(q=>q.c===cfg.course);
  if(cfg.dir) pool = pool.filter(q=>q.dir===cfg.dir);
  if(cfg.doc) pool = pool.filter(q=>q.basis && q.basis.doc===cfg.doc);
  if(cfg.weak){ const w = weakest(2).map(x=>x.d); pool = pool.filter(q=>w.includes(q.dir)); }
  if(cfg.studied) pool = pool.filter(q=> S.done[ (LESSONS.find(l=>l.c===q.c)||{}).id ] || S.qstats[q.id]);
  if(!pool.length) pool = QUESTIONS.slice();
  // адаптивность: чаще показываем вопросы с ошибками и давно не встречавшиеся
  const w = q => { const st=S.qstats[q.id];
    let base = 1 + (q.diff-1)*0.2;
    if(st){ base += (st.bad||0)*1.6; base -= Math.min(1.2,(st.ok||0)*0.35);
      if(st.last) base += Math.min(1.5, daysBetween(st.last, today())/20); }
    else base += 0.8;
    return Math.max(0.2, base); };
  const out=[], src=pool.slice();
  const n = Math.min(cfg.n||8, src.length);
  for(let k=0;k<n;k++){
    const total = src.reduce((a,q)=>a+w(q),0); let r = Math.random()*total;
    let idx = 0; for(let i=0;i<src.length;i++){ r-=w(src[i]); if(r<=0){ idx=i; break; } }
    out.push(src.splice(idx,1)[0]);
  }
  return out;
}
function startQuiz(cfg){
  QZ = {cfg, qs:pickQuestions(cfg), i:0, res:[], sel:null, shown:false};
  go('quiz');
}
function vTestHub(){
  const last = S.exams.slice(-3).reverse();
  return `<h1>Тесты и экзамены</h1>
  <p class="lede">Вопросы не сводятся к определениям: здесь есть ситуации, поиск нарушений, последовательности действий и вопрос «каким документом это регулируется».</p>
  <div class="grid g2">
    <div class="card"><h3 style="margin-top:0">Тренировка слабых тем</h3>
      <p class="small">Вопросы выбираются с учётом ваших ошибок и давности повторения.</p>
      <button class="btn" data-quiz='${JSON.stringify({weak:true,n:8})}'>Начать · 8 вопросов</button></div>
    <div class="card"><h3 style="margin-top:0">Еженедельный экзамен</h3>
      <p class="small">Комплексный тест по изученным темам с разбором слабых мест и рекомендациями.</p>
      <button class="btn" data-quiz='${JSON.stringify({exam:'week',n:12})}'>Начать · 12 вопросов</button></div>
  </div>
  <h2>По направлениям</h2>
  <div class="grid g3">${Object.entries(DIRS).filter(([k])=>QUESTIONS.some(q=>q.dir===k)).map(([k,v])=>`
    <button class="item" data-quiz='${JSON.stringify({dir:k,n:8})}'><span>${v.ic}</span>
      <span><span class="t">${v.t}</span><div class="small">${QUESTIONS.filter(q=>q.dir===k).length} вопросов · освоено ${pct(mastery(k))}%</div></span></button>`).join('')}</div>
  <h2>Итоговая аттестация</h2>
  <div class="card">
    <p class="small">Расширенный экзамен по всем изученным направлениям. Часть вопросов — ситуационные: нужно решить, что делать специалисту.</p>
    <button class="btn" data-quiz='${JSON.stringify({exam:'final',n:Math.min(20,QUESTIONS.length)})}'>Начать итоговую аттестацию</button>
  </div>
  ${last.length?`<h2>Последние результаты</h2><div class="list">${last.map(e=>`<div class="item" style="cursor:default">
    <span class="tag ${e.score/e.total>=0.8?'ok':e.score/e.total>=0.6?'warn':'bad'}">${Math.round(e.score/e.total*100)}%</span>
    <span><span class="t">${e.scope}</span><div class="small">${e.date} · ${e.score} из ${e.total}</div></span></div>`).join('')}</div>`:''}`;
}
function vQuiz(){
  if(!QZ) return vTestHub();

  const q = QZ.qs[QZ.i];

  return `<div class="between"><button class="btn ghost sm" data-v="test">← Выйти</button>
    <span class="small">Вопрос ${QZ.i+1} из ${QZ.qs.length} · сложность ${'●'.repeat(q.diff)}</span></div>
  <div class="bar" style="margin:12px 0 18px"><i style="width:${prog}%"></i></div>
  <div class="card">
    <div class="tiny">${DIRS[q.dir].ic} ${DIRS[q.dir].t} · ${typeName(q.type)}</div>
    <h2 style="margin:6px 0 14px">${h(q.q)}</h2>
    <div id="qbody">${qBody(q)}</div>
    <div id="qfeed"></div>
    <div class="row" style="margin-top:14px" id="qctl">
      ${QZ.shown?`<button class="btn" id="q-next">${QZ.i+1<QZ.qs.length?'Следующий вопрос':'Показать результат'}</button>
        <button class="btn ghost" id="q-explain">Объяснить подробнее</button>
        <button class="btn ghost" id="q-later">Повторить позже</button>`
      :`<button class="btn" id="q-check">Ответить</button>`}
    </div>
    <div id="q-ai"></div>
  </div>`;
}
function typeName(t){ return {single:'один ответ', multi:'несколько ответов', tf:'верно / неверно', match:'сопоставление',
  order:'последовательность', violation:'найди нарушение', situation:'производственная ситуация',
  whichdoc:'какой документ применяется', whichclause:'какое требование применяется'}[t]||t; }
function qBody(q){
  const st = i => QZ.shown ? (isOptCorrect(q,i) ? 'ok' : (selected(i) ? 'bad':'')) : (selected(i)?'sel':'');
  const selected = i => Array.isArray(QZ.sel) ? QZ.sel.includes(i) : QZ.sel===i;
  switch(q.type){
    case 'tf':
      return `<div class="list">${[['Верно',true],['Неверно',false]].map(([t,v],i)=>`
        <button class="quiz-opt" data-opt="${v}" data-state="${QZ.shown?(q.a===v?'ok':(QZ.sel===v?'bad':'')):(QZ.sel===v?'sel':'')}">
        <span class="mk">${v?'В':'Н'}</span><span>${t}</span></button>`).join('')}</div>`;
    case 'multi':
      return `<div class="list">${q.opts.map((o,i)=>`<button class="quiz-opt" data-opt="${i}" data-state="${st(i)}">
        <span class="mk">${(QZ.sel||[]).includes(i)?'✓':''}</span><span>${h(o)}</span></button>`).join('')}</div>
        <p class="tiny">Можно выбрать несколько вариантов.</p>`;
    case 'order':
      return `<p class="tiny">Нажимайте пункты в правильном порядке.</p><div class="list">${q.items.map((o,i)=>{
        const pos = (QZ.sel||[]).indexOf(i);
        return `<button class="quiz-opt" data-opt="${i}" data-state="${QZ.shown?(pos===q.a.indexOf(i)?'ok':'bad'):(pos>=0?'sel':'')}">
          <span class="mk">${pos>=0?pos+1:''}</span><span>${h(o)}</span></button>`;}).join('')}</div>`;
    case 'violation':
      return `<p class="tiny">Отметьте все нарушения.</p><div class="list">${q.items.map((o,i)=>{
        const sel = (QZ.sel||[]).includes(i);
        return `<button class="quiz-opt" data-opt="${i}" data-state="${QZ.shown?(o.v?'ok':(sel?'bad':'')):(sel?'sel':'')}">
          <span class="mk">${sel?'✓':''}</span><span>${h(o.t)}${QZ.shown?`<div class="tiny">${o.v?'Нарушение':'Соответствует'} · ${h(o.b)}</div>`:''}</span></button>`;}).join('')}</div>`;
    case 'match':
      return `<div class="list">${q.pairs.map((p,i)=>`<div class="quiz-opt" style="cursor:default" data-state="${QZ.shown?((QZ.sel||{})[i]===i?'ok':'bad'):''}">
        <span style="flex:1"><b>${h(p[0])}</b></span>
        <select data-match="${i}" style="flex:1;padding:6px;border-radius:7px;border:1px solid var(--line);background:var(--card)">
          <option value="">— выберите —</option>
          ${q.pairs.map((x,j)=>`<option value="${j}" ${(QZ.sel||{})[i]===j?'selected':''}>${h(x[1])}</option>`).join('')}
        </select></div>`).join('')}</div>`;
    default:
      return `<div class="list">${q.opts.map((o,i)=>`<button class="quiz-opt" data-opt="${i}" data-state="${st(i)}">
        <span class="mk">${'АБВГД'[i]}</span><span>${h(o)}</span></button>`).join('')}</div>`;
  }
}
function isOptCorrect(q,i){
  if(q.type==='multi') return q.a.includes(i);
  if(q.type==='violation') return q.items[i].v;
  if(q.type==='order') return true;
  return q.a===i;
}
function gradeQuestion(q){
  const s = QZ.sel;
  switch(q.type){
    case 'tf': return s===q.a;
    case 'multi': { const a=[...q.a].sort().join(), b=[...(s||[])].sort().join(); return a===b; }
    case 'order': return JSON.stringify(s||[])===JSON.stringify(q.a);
    case 'violation': { const right = q.items.map((x,i)=>x.v?i:null).filter(x=>x!==null);
      return JSON.stringify([...(s||[])].sort())===JSON.stringify(right.sort()); }
    case 'match': return q.pairs.every((p,i)=>(s||{})[i]===i);
    default: return s===q.a;
  }
}
function feedbackHTML(q, ok){
  const d = q.basis ? byId(DOCS, q.basis.doc) : null;

  const wrong = QZ.res.filter(r=>!r.ok).map(r=>byId(QUESTIONS,r.id));

    <div class="small" style="margin-top:8px">${score} из ${total} · ${p>=0.8?'Уровень уверенного применения':p>=0.6?'База есть, нужна практика':'Материал требует повторного изучения'}</div></div>
  <h2>По направлениям</h2>
  <div class="grid g3">${Object.entries(byDir).map(([d,v])=>`<div class="stat"><div class="v">${Math.round(v.ok/v.n*100)}%</div>
    <div class="l">${DIRS[d].ic} ${DIRS[d].t} · ${v.ok}/${v.n}</div></div>`).join('')}</div>
  ${wrong.length?`<h2>Разбор ошибок</h2><div class="list">${wrong.map(q=>`
    <div class="card"><div class="tiny">${DIRS[q.dir].t} · ${typeName(q.type)}</div>
      <b>${h(q.q)}</b>

      <div class="row">${q.basis?sourceBtn(q.basis.doc,q.basis.cl):''}
        <button class="btn ghost sm" data-later="${q.id}">Повторить позже</button>
        ${q.art?`<button class="btn ghost sm" data-article="${q.art}">Изучить пункт</button>`:''}</div></div>`).join('')}</div>`
    :`<div class="expl"><h4>Ошибок нет</h4><p>Стабильный результат повышает уровень освоения сильнее, чем один удачный тест. Вернитесь к этим темам через несколько дней.</p></div>`}
  <h2>Что делать дальше</h2>
  <ul>
    ${docs.length?`<li>Повторить документы: ${docs.map(id=>h(byId(DOCS,id).short)).join(', ')}.</li>`:''}

function vInspect(){
  const i = byId(INSPECTIONS, INS.id); if(!i) return vPractice();
  const total = i.items.filter(x=>x.v).length;

    ['Прогресс','mastery, SRS, стабильность, рекомендации'],
    ['Мониторинг изменений','сбор редакций, диффы, влияние на контент'],
    ['Экспертные источники','opinions с обязательной маркировкой'],
    ['Поиск','индекс по документам, пунктам, урокам, вопросам'],
    ['AI-шлюз','RAG, ограничения, отказ при отсутствии подтверждения'],
    ['Уведомления','изменения, повторения, слабые темы']
  ].map(([t,d])=>`<div class="stat"><div style="font-weight:600">${t}</div><div class="l">${d}</div></div>`).join('')}</div>
  <h2>Модель данных</h2>
  <pre style="overflow:auto;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:12.5px">documents(id, title, short, kind, number, adopted_at, effective_at,
          status, status_note, edition, jurisdiction, territory,
          authority, source_name, source_url, verified_at, category[])
document_links(from_id, to_id, relation)   -- related | replaces | replaced_by
articles(id, document_id, clause, title, text, text_mode, simple,
         practice, example, mistakes[], inspector_note, remember)
courses(id, title, direction, jurisdiction, level, about)
lessons(id, course_id, order_no, title, kind, goal, blocks jsonb,
        article_ids[], chain jsonb, video jsonb, audio_text)
questions(id, direction, course_id, type, difficulty, payload jsonb,
          answer jsonb, why, trap, basis_document_id, basis_clause)
cards(id, direction, front, back, basis_document_id, basis_clause)
expert_opinions(id, author, source_type, source_url, published_at,
                document_id, clause, thesis, relation_to_norm, counter)
changes(id, document_id, happened_at, severity, before_text, after_text,
        plain, todo[], affected_ids[])
users(id, role, experience, country, directions[], daily_minutes)
user_progress(user_id, direction, mastery, updated_at)
user_answers(user_id, question_id, correct, answered_at)
user_cards(user_id, card_id, due_at, interval_days, reps, lapses)</pre>
  <h2>Конвейер добавления документа</h2>
  <div class="chain">${['Импорт из официального источника','Проверка: существует · номер · дата · статус · редакция',
    'Разметка пунктов и связей','Написание слоёв объяснения','Генерация вопросов и карточек','Ревизия специалистом',
    'Публикация и включение в мониторинг изменений'].map((t,i)=>`${i?'<div class="arw"></div>':''}<div class="step"><b>Шаг ${i+1}</b>${t}</div>`).join('')}</div>
  <h2>Защита от ошибок AI</h2>
  <ul>
    <li>AI отвечает только по переданному контексту базы; запрос всегда содержит запрет на изобретение документов и пунктов.</li>
    <li>Если подтверждения нет — ответ «Недостаточно данных для подтверждения. Проверьте официальный источник».</li>
    <li>Юрисдикции разделены на уровне данных: документ не может одновременно относиться к РФ и ЕС.</li>
    <li>Мнение эксперта хранится в отдельной сущности и визуально маркируется жёлтым.</li>
    <li>Каждый учебный тезис привязан к документу и пункту — кнопка «Откуда это?» есть в каждом блоке.</li>
  </ul>
  <h2>Что уже работает в этой сборке</h2>
  <ul>
    <li>${DOCS.length} документов с паспортами и статусами, ${ARTICLES.length} разобранных пунктов, ${LESSONS.length} уроков, ${QUESTIONS.length} вопросов девяти типов, ${CARDS.length} карточек, ${CASES.length} кейсов, ${INSPECTIONS.length + SCENARIOS.length} практических режимов.</li>
    <li>Адаптивный подбор вопросов, интервальное повторение, расчёт уровня освоения, поиск, мониторинг изменений, уведомления, аудиоозвучка, AI-помощник с ограничениями.</li>
    <li>Прогресс сохраняется между сессиями и устройствами.</li>
  </ul>`;
}

/* ============================================================
   МОДУЛЬ 12. СОБЫТИЯ
   ============================================================ */
function bindView(){
  if(!S.onboarded){ bindOnboard(); return; }
  bindExamples();
  const on = (sel, ev, fn) => APP.querySelectorAll(sel).forEach(e=>e.addEventListener(ev, fn));
  on('[data-course]','click', e=>go('course',{id:e.currentTarget.dataset.course}));
  on('[data-lesson]','click', e=>go('lesson',{id:e.currentTarget.dataset.lesson}));
  on('[data-doc]','click', e=>go('doc',{id:e.currentTarget.dataset.doc}));
  on('[data-article]','click', e=>go('article',{id:e.currentTarget.dataset.article}));
  on('[data-case]','click', e=>go('case',{id:e.currentTarget.dataset.case}));
  on('[data-change]','click', ()=>go('changes'));
  on('[data-filter]','click', e=>{ const f=JSON.parse(e.currentTarget.dataset.filter);
    go(e.currentTarget.dataset.gov||R.v, {...R.p, ...f}); });
  on('[data-quiz]','click', e=>startQuiz(JSON.parse(e.currentTarget.dataset.quiz)));
  on('[data-notif]','click', e=>{ const n=notifications().find(x=>x.id===e.currentTarget.dataset.notif); n&&n.go(); });
  on('[data-readch]','click', e=>{ const id=e.currentTarget.dataset.readch;
    if(!S.readChanges.includes(id)) S.readChanges.push(id); save(); render(); });
  on('[data-save]','click', e=>{ const id=e.currentTarget.dataset.save;
    S.saved.includes(id) ? S.saved.splice(S.saved.indexOf(id),1) : S.saved.push(id); save(); render(); });
  on('[data-done]','click', e=>{ const id=e.currentTarget.dataset.done; S.done[id]=today(); addXP(10); touchStreak(); save();
    toast('Урок отмечен как изученный'); const l=byId(LESSONS,id);
    const nx = LESSONS.filter(x=>x.c===l.c).sort((a,b)=>a.n-b.n).find(x=>!S.done[x.id]);
    nx ? go('lesson',{id:nx.id}) : go('course',{id:l.c}); });
  on('[data-min]','click', e=>{ S.profile.minutes=+e.currentTarget.dataset.min; save(); render(); });

  // поиск
  const si = $('#search-input');
  if(si){ si.addEventListener('input', ()=>{ R.p.q=si.value; const pos=si.selectionStart; render();
    const n=$('#search-input'); if(n){ n.focus(); n.setSelectionRange(pos,pos);} }); }
  on('[data-sq]','click', e=>go('search',{q:e.currentTarget.dataset.sq}));
  on('[data-sres]','click', e=>{ const r=searchAll(R.p.q||'')[+e.currentTarget.dataset.sres]; r&&r.go(); });
  const ds = $('#doc-search');
  if(ds){ ds.addEventListener('input', ()=>{ R.p.q=ds.value; const pos=ds.selectionStart; render();
    const n=$('#doc-search'); if(n){ n.focus(); n.setSelectionRange(pos,pos);} }); }

  // аудио
  const pl = $('#play-lesson');
  if(pl){ const l=byId(LESSONS,R.p.id);
    pl.addEventListener('click', ()=>speak([l.title, l.goal, ...(l.blocks||[]).map(b=>(b.h?b.h+'. ':'')+(b.p||(b.list||[]).join('. ')))].join(' '), pl)); }
  const vs = $('#video-script');
  if(vs){ const l=byId(LESSONS,R.p.id);
    vs.addEventListener('click', ()=>modal(`<h2 style="margin-top:0">Сценарий учебного видео</h2>
      <div class="warnstripe">Это учебный материал приложения, а не официальный документ. Видео не заменяет нормативный текст.</div>
      <ol>${l.video.frames.map(f=>`<li>${h(f)}</li>`).join('')}</ol>
      <button class="btn ghost" onclick="closeModal()">Закрыть</button>`)); }

  // кнопки «Объясни мне»
  window.aiOnArticle = async function(artId, prompt){
    const a = byId(ARTICLES, artId); if(!a) return;
    const d = byId(DOCS, a.doc);
    modal(`<h2 style="margin-top:0">Объяснение приложения</h2>
      <div class="norm"><div class="lbl">🟦 ЗАКОНОДАТЕЛЬНОЕ ТРЕБОВАНИЕ</div>
        <b>${h(d.kind)} ${h(d.num)}</b> · п. ${h(a.clause)}
        <div class="small" style="margin-top:4px">${h(d.short)}</div></div>
      <div class="expl"><div class="lbl">🟨 ОБЪЯСНЕНИЕ ПРИЛОЖЕНИЯ</div>
        <p id="ai-art-t">Готовлю объяснение…</p></div>
      <div class="row" style="margin-top:12px">${sourceBtn(a.doc, a.clause)}</div>
      <p class="tiny" style="margin-top:10px">Помощник работает только с данными карточки пункта и не добавляет норм от себя.
        Всё, что важно для работы, сверяйте с первоисточником.</p>`);
    const set = t => { const el = $('#ai-art-t'); if(el) el.textContent = t; };
    const r = await ask(prompt, ctxForArticle(a), set);
    if(r.err){
      set('');
      const el = $('#ai-art-t'); if(!el) return;
      el.innerHTML = `<b>Помощник недоступен в этом режиме.</b><br>Ниже — подготовленное заранее объяснение, привязанное к пункту.
        <div class="hr"></div><b>Простыми словами.</b> ${h(a.simple)}
        <div style="margin-top:8px"><b>На практике.</b> ${h(a.practice)}</div>
        ${a.example?`<div style="margin-top:8px"><b>Пример.</b> ${h(a.example)}</div>`:''}`;
    } else set(r.text);
  };
  on('[data-explain]','click', e=>aiOnArticle(e.currentTarget.dataset.explain,'Объясни этот пункт максимально просто, как новичку, в 4–6 предложениях.'));
  on('[data-example]','click', e=>aiOnArticle(e.currentTarget.dataset.example,'Приведи один реалистичный пример ситуации на предприятии по этому пункту и покажи, что должен сделать специалист.'));
  on('[data-check]','click', e=>aiOnArticle(e.currentTarget.dataset.check,'Задай мне три вопроса по этому пункту разной сложности, без ответов. В конце укажи, что ответы можно проверить в тесте приложения.'));
  on('[data-links]','click', e=>{ const a=byId(ARTICLES,e.currentTarget.dataset.links); const d=byId(DOCS,a.doc);
    modal(`<h2 style="margin-top:0">Связи документа</h2>${graphHTML(d)}
      <div class="list" style="margin-top:10px">${(d.related||[]).map(id=>{const r=byId(DOCS,id);
        return `<button class="item" onclick="closeModal();go('doc',{id:'${r.id}'})"><span class="tag ${statusClass(r.status)}">${jurFlag(r.jur)}</span>
        <span><span class="t">${h(r.short)}</span><div class="small">${h(r.kind)} ${h(r.num)}</div></span></button>`;}).join('')}</div>`); });
  on('[data-ai]','click', ()=>go('ai'));

  // тест
  on('[data-opt]','click', e=>{
    if(QZ.shown) return;
    const q = QZ.qs[QZ.i], raw = e.currentTarget.dataset.opt;
    if(q.type==='tf') QZ.sel = raw==='true';
    else if(q.type==='multi'||q.type==='violation'){ const i=+raw; QZ.sel=QZ.sel||[];
      QZ.sel.includes(i) ? QZ.sel.splice(QZ.sel.indexOf(i),1) : QZ.sel.push(i); }
    else if(q.type==='order'){ const i=+raw; QZ.sel=QZ.sel||[];
      QZ.sel.includes(i) ? QZ.sel.splice(QZ.sel.indexOf(i),1) : QZ.sel.push(i); }
    else QZ.sel = +raw;
    render();
  });
  on('[data-match]','change', e=>{ QZ.sel = QZ.sel||{}; QZ.sel[+e.currentTarget.dataset.match] = +e.currentTarget.value; });
  const qc = $('#q-check');
  if(qc) qc.addEventListener('click', ()=>{
    const q = QZ.qs[QZ.i];
    if(QZ.sel===null||QZ.sel===undefined||(Array.isArray(QZ.sel)&&!QZ.sel.length)){ toast('Выберите ответ'); return; }
    const ok = gradeQuestion(q);
    const st = S.qstats[q.id] || {ok:0,bad:0,streak:0};
    ok ? (st.ok++, st.streak=(st.streak||0)+1) : (st.bad++, st.streak=0);
    st.last = today(); S.qstats[q.id]=st; QZ.res.push({id:q.id, ok}); QZ.shown=true;
    addXP(ok? (2+q.diff) : 1); touchStreak(); save(); render();
    const f=$('#qfeed'); if(f){ f.innerHTML = feedbackHTML(q, ok); f.scrollIntoView({behavior:'smooth', block:'nearest'}); }
  });
  if(QZ && QZ.shown && $('#qfeed') && !$('#qfeed').innerHTML){
    $('#qfeed').innerHTML = feedbackHTML(QZ.qs[QZ.i], QZ.res[QZ.res.length-1]?.ok);
  }
  const qn = $('#q-next');
  if(qn) qn.addEventListener('click', ()=>{ QZ.i++; QZ.sel=null; QZ.shown=false; render(); });
  const ql = $('#q-later');
  if(ql) ql.addEventListener('click', ()=>{ scheduleLater(QZ.qs[QZ.i]); });
  on('[data-later]','click', e=>scheduleLater(byId(QUESTIONS, e.currentTarget.dataset.later)));
  const qe = $('#q-explain');
  if(qe) qe.addEventListener('click', async ()=>{
    const q = QZ.qs[QZ.i], box = $('#q-ai'); if(!box) return;
    box.innerHTML = '<div class="expl"><h4>Помощник</h4><p id="q-ai-t">Готовлю объяснение…</p></div>';
    const a = q.art ? byId(ARTICLES,q.art) : null;
    const ctx = (a?ctxForArticle(a)+'\n\n':'') + `Вопрос теста: ${q.q}\nПравильный ответ и обоснование: ${q.why}\nТипичная ошибка: ${q.trap||'—'}\nОснование: ${q.basis?byId(DOCS,q.basis.doc).short+' '+q.basis.cl:'—'}`;
    const r = await ask('Объясни подробно, почему правильный ответ именно такой, и как это запомнить. Не добавляй норм, которых нет в контексте.', ctx,
      t=>{ const el=$('#q-ai-t'); if(el) el.textContent=t; });
    const el=$('#q-ai-t'); if(el) el.textContent = r.err ? 'Помощник недоступен в этом режиме. Разбор выше подготовлен заранее и привязан к документу.' : r.text;
  });

  // карточки
  const co = $('#card-open'); if(co) co.addEventListener('click', ()=>{ CARD.open=true; render(); });
  on('[data-grade]','click', e=>{ gradeCard(CARD.id, +e.currentTarget.dataset.grade); CARD.open=false; CARD.id=null; render(); });

  // практика
  on('[data-inspect]','click', e=>{ INS={id:e.currentTarget.dataset.inspect, sel:[], done:false}; go('inspect'); });
  on('[data-ins]','click', e=>{ if(INS.done) return; const i=+e.currentTarget.dataset.ins;
    INS.sel.includes(i) ? INS.sel.splice(INS.sel.indexOf(i),1) : INS.sel.push(i); render(); });
  const ic = $('#ins-check');
  if(ic) ic.addEventListener('click', ()=>{ const insp=byId(INSPECTIONS,INS.id);
    const need = insp.items.filter(x=>x.v).length;
    const found = INS.sel.filter(k=>insp.items[k].v).length;
    const wrong = INS.sel.filter(k=>!insp.items[k].v).length;
    const score = Math.max(0, Math.round((found - wrong*0.5)/need*100));
    INS.done = true;
    if(!S.practice[INS.id] || S.practice[INS.id].score<score){ S.practice[INS.id]={score, date:today()}; }
    addXP(10); save(); render(); });
  on('[data-scenario]','click', e=>{ SCN={id:e.currentTarget.dataset.scenario, step:0, answers:[]}; go('scenario'); });
  on('[data-scn]','click', e=>{ const s=byId(SCENARIOS,SCN.id), st=s.steps[SCN.step], o=st.opts[+e.currentTarget.dataset.scn];
    SCN.answers.push(!!o.ok);
    modal(`<div class="${o.ok?'expl':'warnstripe'}"><h4 style="margin-top:0">${o.ok?'Верное решение':'Неверное решение'}</h4><p>${h(o.why)}</p></div>
      <button class="btn" id="scn-next">${SCN.step+1<s.steps.length?'Дальше':'К разбору'}</button>`);
    $('#scn-next').addEventListener('click', ()=>{ closeModal(); SCN.step++; render(); }); });

  // AI
  const ai = $('#ai-send'), aii = $('#ai-input');
  if(ai) ai.addEventListener('click', ()=>{ const v=aii.value; aii.value=''; aiSend(v); });
  if(aii) aii.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const v=aii.value; aii.value=''; aiSend(v); } });
  on('[data-aiq]','click', e=>aiSend(e.currentTarget.dataset.aiq));

  const rs = $('#reset');
  if(rs) rs.addEventListener('click', ()=>{ modal(`<h2 style="margin-top:0">Сбросить прогресс?</h2>
    <p>Будут удалены отметки об изученном, статистика ответов, карточки повторения и достижения. Отменить нельзя.</p>
    <div class="row"><button class="btn" id="rs-yes">Сбросить</button><button class="btn ghost" onclick="closeModal()">Отмена</button></div>`);
    $('#rs-yes').addEventListener('click', ()=>{ const p=S.profile; S=JSON.parse(JSON.stringify(DEFAULT_STATE));
      S.profile=p; S.onboarded=true; S.plan=buildPlan(); save(); closeModal(); go('home'); }); });
}
function scheduleLater(q){
  const st = S.qstats[q.id] || {ok:0,bad:0,streak:0};
  st.bad = (st.bad||0) + 0.5; st.last = today(); S.qstats[q.id]=st; save();
  toast('Вопрос вернётся в ближайших тестах');
}
boot();
</script>
</body>
</html>
